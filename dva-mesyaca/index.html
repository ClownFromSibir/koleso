<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Два месяца</title>
<meta name="theme-color" content="#2a1b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1c1424;color:var(--ink);font:18px/1.4 "Nunito",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden}
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.bars i.cur b{animation:fill var(--dur,7s) linear forwards}
@keyframes fill{to{width:100%}}
.card{position:absolute;inset:0;padding:70px 28px 60px;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .45s}
.card.on{opacity:1}
.card .k{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:13px;opacity:.75;margin-bottom:10px}
.big{font:900 clamp(64px,22vw,110px)/1 "Nunito",sans-serif;letter-spacing:-.03em;margin:4px 0 10px}
.mid{font:900 clamp(38px,12vw,58px)/1.05 "Nunito",sans-serif;margin:4px 0 12px}
.hand{font:700 clamp(30px,9vw,42px)/1.15 "Caveat",cursive}
.p{font-size:19px;opacity:.92;margin:8px 0}
.small{font-size:14px;opacity:.7;margin-top:16px}
.row{display:flex;gap:14px;align-items:flex-end;margin:14px 0}
.row .n{font:900 44px/1 "Nunito",sans-serif}
.row .l{font-size:15px;opacity:.85;padding-bottom:4px}
.emoji{font-size:clamp(80px,26vw,130px);line-height:1;margin:6px 0}
.in>*{opacity:0;transform:translateY(16px);animation:up .6s cubic-bezier(.2,.9,.3,1) forwards}
.in>*:nth-child(2){animation-delay:.15s}.in>*:nth-child(3){animation-delay:.35s}.in>*:nth-child(4){animation-delay:.6s}
.in>*:nth-child(5){animation-delay:.85s}.in>*:nth-child(6){animation-delay:1.1s}.in>*:nth-child(7){animation-delay:1.35s}
@keyframes up{to{opacity:1;transform:none}}
.tap{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;opacity:.55;z-index:5;pointer-events:none}
.btn{display:inline-block;margin-top:22px;background:#fff;color:#2a1b3d;border:none;border-radius:999px;padding:14px 26px;font:900 17px "Nunito",sans-serif;cursor:pointer;align-self:flex-start;position:relative;z-index:6}
.float{position:absolute;font-size:28px;opacity:.0;animation:floaty 6s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%{opacity:0;transform:translateY(40px)}20%{opacity:.6}80%{opacity:.6}100%{opacity:0;transform:translateY(-120px)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.letter{background:rgba(255,255,255,.12);border-radius:20px;padding:20px 20px 16px;font-size:18px;line-height:1.5}
.letter .sig{text-align:right;font:700 28px "Caveat",cursive;margin-top:8px}
</style>
</head>
<body>
<div id="app"><div class="bars" id="bars"></div><div class="tap" id="tap">нажимай справа — дальше, слева — назад</div></div>
<script>
const MET=Date.UTC(2026,7,20); /* 20 августа 2026 */
function together(){const n=new Date();const d=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-MET)/864e5);return {d,h:Math.floor((Date.now()-new Date(2026,7,20,17,5).getTime())/36e5)}}
const T=together();
const fmt=n=>n.toLocaleString("ru-RU");
/* Цифры посчитаны по архиву переписки с 20 августа по 14 октября 2026 */
const CARDS=[
 {bg:["#ff7a59","#c13f7a"],html:`<div class="k">20 октября 2026</div><div class="hand">Юля и Андрей</div><div class="mid">Два месяца</div><p class="p">Я всё посчитал. Ну, почти всё.</p><p class="small">Листай. Нажатие справа — дальше.</p>`,dur:6},
 {bg:["#5b3fd1","#2a1b3d"],html:`<div class="k">Вместе уже</div><div class="big" data-n="${T.d}">0</div><p class="p">${["день","дня","дней"][(T.d%10===1&&T.d%100!==11)?0:(T.d%10>=2&&T.d%10<=4&&(T.d%100<10||T.d%100>=20))?1:2]}. Или примерно <b>${fmt(T.h)}</b> часов.</p><p class="small">Считается вживую. Завтра станет больше.</p>`},
 {bg:["#0f9b8e","#1d4e6b"],html:`<div class="k">Мы написали друг другу</div><div class="big" data-n="8261">0</div><p class="p">сообщение. Это примерно <b>148 в день</b>.</p><p class="small">И это только текст. Фото, стикеры и кружочки — отдельно.</p>`},
 {bg:["#e9a23b","#c8553d"],html:`<div class="k">Дней без переписки</div><div class="big">0</div><p class="p">Ни одного. 56 дней из 56.</p><p class="p">Даже в самый тихий день было <b>9 сообщений</b>. Даже тогда.</p>`},
 {bg:["#d64161","#6b2d5c"],html:`<div class="k">Слово «люблю»</div><div class="big" data-n="104">0</div><p class="p">раза написано текстом.</p><p class="small">В голосовых и кружочках мы не считали. Иначе бы цифра не влезла в экран.</p>`},
 {bg:["#3a7bd5","#1c2a5c"],html:`<div class="k">Самый болтливый день</div><div class="mid">11 октября</div><div class="big" data-n="378" style="font-size:clamp(54px,18vw,90px)">0</div><p class="p">сообщений за один день.</p><p class="small">Что там было — знаем только мы.</p>`},
 {bg:["#f6a5c0","#8a6fd1"],html:`<div class="k">Наше расписание</div><div class="row"><div class="n">6:48</div><div class="l">в среднем «доброе утро»</div></div><div class="row"><div class="n">22:56</div><div class="l">в среднем «спокойной ночи»</div></div><div class="row"><div class="n">22:00</div><div class="l">час, когда мы болтаем больше всего</div></div><p class="small">Единственное расписание, которое никто ни разу не менял.</p>`},
 {bg:["#232946","#0d0f1e"],html:`<div class="k">После полуночи</div><div class="big" data-n="152">0</div><p class="p">сообщения.</p><p class="p">Кто-то должен был спать. Никто не спал.</p>`,float:"🌙"},
 {bg:["#ff9a3c","#d6416b"],html:`<div class="k">Медиа-отдел</div><div class="row"><div class="n" data-n="758">0</div><div class="l">фотографий</div></div><div class="row"><div class="n" data-n="502">0</div><div class="l">стикера</div></div><div class="row"><div class="n" data-n="138">0</div><div class="l">кружочков</div></div><p class="p">Стикерный чемпион — <b>Юля</b>: 258 штук.</p>`},
 {bg:["#7f5af0","#2cb67d"],html:`<div class="k">Главный смайлик Юли</div><div class="emoji">😏</div><div class="mid" data-n="263">0</div><p class="p">раза. Подозрительно. Очень подозрительно.</p>`},
 {bg:["#c13f7a","#ff7a59"],html:`<div class="k">Главный смайлик Андрея</div><div class="emoji">❤️</div><div class="mid" data-n="181">0</div><p class="p">раз. Тут всё понятно и без объяснений.</p>`},
 {bg:["#4c9a2a","#1f4d2b"],html:`<div class="k">Лягушек на двоих</div><div class="emoji">🐸</div><div class="mid" data-n="49">0</div><p class="p">Юля — 30, Андрей — 19. Лягушачий счёт в пользу Юли.</p>`,float:"🐸"},
 {bg:["#8d6e63","#3e2723"],html:`<div class="k">Если всё распечатать</div><div class="big" data-n="245">0</div><p class="p">книжных страниц.</p><p class="p">У нас уже целый роман. Жанр — тот, где всё хорошо кончается. Точнее, не кончается.</p>`},
 {bg:["#475569","#1e293b"],html:`<div class="k">Самая долгая тишина</div><div class="big">24 ч</div><p class="p">4–5 сентября.</p><p class="p">Рекорд, который мы не будем повторять. Договорились?</p>`},
 {bg:["#ff7a59","#c13f7a"],html:`<div class="k">Два месяца</div><div class="letter">Юль, цифры можно посчитать: дни, сообщения, лягушек. А то, как сильно ты мне дорога, не считается — тут никакой статистики не хватит.<br><br>Спасибо, что ты есть. Спасибо за каждое «доброе утро» и каждое «споки». Впереди ещё очень много страниц нашего романа, и я хочу прочитать их все вместе с тобой.<br><br>С нашими двумя месяцами ❤️<div class="sig">— Андрей</div></div><button class="btn" id="again">Ещё раз сначала</button>`,dur:0,end:1,float:"❤️"}
];
const app=document.getElementById("app"),bars=document.getElementById("bars");
bars.innerHTML=CARDS.map(()=>"<i><b></b></i>").join("");
let cur=-1,timer=0,el=null;
function countUp(node){const to=+node.dataset.n,t0=performance.now(),dur=1100;const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);node.textContent=fmt(Math.round(to*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function show(i){
  if(i<0)i=0;if(i>=CARDS.length)i=CARDS.length-1;
  clearTimeout(timer);cur=i;const C=CARDS[i];
  [...bars.children].forEach((b,k)=>{b.className=k<i?"done":k===i?"cur":"";b.style.setProperty("--dur",(C.dur||7)+"s")});
  const old=el;el=document.createElement("div");el.className="card";
  el.style.background=`linear-gradient(160deg,${C.bg[0]},${C.bg[1]})`;
  el.innerHTML=`<div class="in" style="display:flex;flex-direction:column">${C.html}</div>`;
  if(C.float)for(let f=0;f<8;f++){const s=document.createElement("span");s.className="float";s.textContent=C.float;s.style.left=(5+Math.random()*90)+"%";s.style.bottom=(Math.random()*40)+"%";s.style.animationDelay=(Math.random()*5)+"s";el.appendChild(s)}
  app.insertBefore(el,bars);requestAnimationFrame(()=>el.classList.add("on"));
  if(old){old.classList.remove("on");setTimeout(()=>old.remove(),500)}
  el.querySelectorAll("[data-n]").forEach(n=>setTimeout(()=>countUp(n),350));
  document.getElementById("tap").style.display=C.end?"none":"";
  if(C.end){[...bars.children].forEach(b=>b.className="done");confetti();const a=el.querySelector("#again");a.onclick=e=>{e.stopPropagation();show(0)}}
  else if(C.dur!==0)timer=setTimeout(()=>show(cur+1),(C.dur||7)*1000);
}
app.addEventListener("click",e=>{if(e.target.closest(".btn"))return;const x=e.clientX-app.getBoundingClientRect().left;show(x<app.clientWidth*.3?cur-1:cur+1)});
let sx=null;app.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
app.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){e.preventDefault();show(dx<0?cur+1:cur-1)}});
function confetti(){const cols=["#ff7a59","#f6c445","#8fb27a","#9b86c9","#6fa3c7","#ff9ec7","#fff"];for(let i=0;i<90;i++){const s=document.createElement("span");s.className="confetti";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.animationDuration=(2.5+Math.random()*2.5)+"s";s.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),6000)}}
show(0);
</script>
</body>
</html>
