<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колесо: тест</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#c8553d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7efe1; --paper2:#fbf6ec; --ink:#3a2e28; --muted:#8a7a6d;
    --accent:#c8553d; --accent2:#e9a23b; --line:#e6d9c3;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(233,162,59,.18), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(200,85,61,.10), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(140,170,120,.15), transparent 50%);
    color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  main{max-width:520px;margin:0 auto;padding:28px 16px 48px;text-align:center}
  h1{font-family:"Caveat",cursive;font-size:46px;line-height:1;margin:0 0 4px;color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
  .date{display:inline-block;background:var(--paper2);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);margin-bottom:18px}

  .wheel-wrap{position:relative;width:min(88vw,380px);aspect-ratio:1;margin:0 auto}
  .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:3}
  #wheel{width:100%;height:100%;display:block;transform:rotate(0deg);
    transition:transform 5.6s cubic-bezier(.12,.72,.1,1);filter:drop-shadow(0 8px 18px rgba(90,60,30,.18))}
  #wheel text{font-family:"Nunito",system-ui,sans-serif;font-weight:800;fill:#3a2e28;font-size:14.5px}
  .hub{position:absolute;inset:0;margin:auto;width:21%;height:21%;border-radius:50%;
    background:var(--paper2);border:3px solid var(--ink);display:grid;place-items:center;font-size:26px;z-index:2;
    box-shadow:0 2px 6px rgba(0,0,0,.15)}

  .btn{margin-top:26px;font:800 18px "Nunito",sans-serif;color:#fff;background:var(--accent);border:none;
    border-radius:16px;padding:15px 34px;cursor:pointer;box-shadow:0 5px 0 #9c3c29;transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9c3c29}
  .btn:disabled{background:#cbbfb0;box-shadow:0 5px 0 #a99c8c;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent);padding:10px 22px;font-size:15px;margin-top:14px}
  .timer{margin-top:12px;color:var(--muted);font-size:14px;min-height:20px}

  .history{margin-top:34px;text-align:left}
  .history h2{font-family:"Caveat",cursive;font-size:30px;margin:0 0 8px;text-align:center}
  .history ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .history li{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    display:flex;gap:10px;align-items:center;cursor:pointer}
  .history li .d{color:var(--muted);font-size:13px;min-width:44px}
  .history .empty{color:var(--muted);text-align:center;font-size:14px}

  .overlay{position:fixed;inset:0;background:rgba(58,46,40,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex;animation:fade .25s ease}
  .card{background:var(--paper2);border-radius:22px;max-width:420px;width:100%;padding:26px 22px 20px;position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.4,.4,1);text-align:left;
    background-image:linear-gradient(transparent 31px, rgba(200,180,150,.25) 32px);background-size:100% 32px}
  .chip{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
  .card h3{font-family:"Caveat",cursive;font-size:36px;margin:10px 0 6px;line-height:1.05}
  .card p{font-size:17px;line-height:1.55;margin:0 0 14px;white-space:pre-line}
  .card .sign{font-family:"Caveat",cursive;font-size:24px;text-align:right;color:var(--accent);margin:0}
  .card .note{font-size:13px;color:var(--muted);margin-top:8px}
  .close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}

  .confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:20;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  footer{margin-top:36px;color:var(--muted);font-size:12px}

  .pointer{transform-origin:50% 0}
  .pointer.tick{animation:tick .12s ease-out}
  @keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}
  .tabs{display:flex;gap:6px;margin:0 0 16px}
  .tab{flex:1;border:2px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:12px;padding:9px 4px;font:800 14px "Nunito",sans-serif;cursor:pointer}
  .tab.on{border-color:var(--accent);color:var(--accent)}
  .streak{margin-top:10px;font-size:14px;color:var(--muted)}
  .letter{display:none;margin:0 auto 14px;max-width:340px;background:#fff;border:2px dashed var(--accent);border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.03)}}
  .card.rare{box-shadow:0 0 0 4px #b9a3f0,0 20px 50px rgba(0,0,0,.25)}
  .card.leg{box-shadow:0 0 0 5px #f5b82e,0 0 40px #ffd95e,0 20px 50px rgba(0,0,0,.25)}
  .card.sp{box-shadow:0 0 0 5px #ff7a9a,0 20px 50px rgba(0,0,0,.25)}
  .ans{display:none;margin:0 0 10px;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;padding:8px 14px;font:800 15px "Nunito",sans-serif;cursor:pointer}
  .history li.rare{border-color:#b9a3f0}.history li.leg{border-color:#f5b82e;background:#fff8e1}.history li.sp{border-color:#ff7a9a}
  .history li small{color:var(--muted)}
  body.flash:after{content:"";position:fixed;inset:0;background:radial-gradient(circle,#fff6c8,transparent 70%);animation:flashout .9s ease forwards;pointer-events:none;z-index:9}
  @keyframes flashout{from{opacity:1}to{opacity:0}}
  .pane{text-align:left}
  .coupon{display:flex;gap:10px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .coupon>div{flex:1}.coupon b{display:block;font-size:16px}.coupon small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .coupon.rare{border-color:#b9a3f0}.coupon.leg{border-color:#f5b82e;background:#fff8e1}.coupon.used{opacity:.55}
  .btn.mini{margin:0;padding:8px 12px;font-size:14px;box-shadow:0 3px 0 #9c3c29}
  .pane h3{font-family:"Caveat",cursive;font-size:26px;margin:18px 0 8px}
  .empty{color:var(--muted);text-align:center}
  .prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--accent)}
  .pane details{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .pane summary{font-weight:800;cursor:pointer;display:flex;justify-content:space-between}
  .cg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ci{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:700 13px "Nunito",sans-serif;color:var(--ink);cursor:pointer}
  .ci.lock{color:#b9ab9c;cursor:default;background:transparent}.ci.rare{border-color:#9f86e0}.ci.leg{border-color:#f5b82e;background:#fff8e1}.ci.sp{border-color:#ff7a9a}
  #testpanel{display:none;margin:18px 0 0;text-align:left;background:#eef3f7;border:2px dashed #5f8fb4;border-radius:14px;padding:12px;font-size:14px}
  #testpanel .row{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tb{border:1px solid #5f8fb4;background:#fff;color:#2c4f6b;border-radius:999px;padding:5px 10px;font:700 13px "Nunito",sans-serif;cursor:pointer}
  .tb.on{background:#5f8fb4;color:#fff}
  #testpanel .small{color:var(--muted);font-size:12px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1 id="h1">Колесо: тест</h1>
  <p class="sub" id="sub">Тестовая версия: крути сколько хочешь. Память отдельная от настоящего колеса.</p>
  <div class="tabs"><button class="tab on" data-p="pWheel">🎡 Колесо</button><button class="tab" data-p="pCoupons">🎟 Купоны</button><button class="tab" data-p="pColl">📒 Коллекция</button></div>

  <section class="paneW" id="pWheel">
  <div class="date" id="date"></div>
  <div class="letter" id="letter">📩 Тебе письмо на сегодня. Нажми, чтобы открыть</div>
  <div class="wheel-wrap">
    <div class="pointer" id="pointer"></div>
    <svg id="wheel" viewBox="0 0 400 400" aria-label="Колесо"></svg>
    <div class="hub">❤️</div>
  </div>
  <button class="btn" id="spin">Крутить!</button>
  <div class="timer" id="timer"></div>
  <div class="streak" id="streak"></div>
  <button class="btn" id="chest" style="display:none">🎁 Открыть сундук серии</button>
  <button class="btn ghost" id="again" style="display:none">Открыть сегодняшнее</button>
  <div id="testpanel"></div>
  <section class="history">
    <h2>Уже выпадало</h2>
    <ul id="hist"></ul>
  </section>
  </section>

  <section class="pane" id="pCoupons" style="display:none">
    <p class="empty" id="cpCount"></p>
    <div id="coupons"></div>
  </section>

  <section class="pane" id="pColl" style="display:none">
    <div id="collTotal"></div>
    <div id="coll"></div>
    <p class="empty" style="font-size:13px">✦ — редкие, ★ — легендарные. Закрытые карточки откроются, когда выпадут на колесе.</p>
  </section>

  <footer>Сделано с любовью из Питера</footer>
</main>

<div class="overlay" id="overlay">
  <div class="card" id="card" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <span class="chip" id="cChip"></span>
    <h3 id="cTitle"></h3>
    <p id="cText"></p>
    <button class="ans" id="cAns"></button>
    <p class="sign">— Андрей</p>
    <div class="note" id="cNote"></div>
  </div>
</div>

<script>
/* ================= БАЗА =================
   c — категория: k купон, c комплимент, a анекдот, z задание, p предсказание, f факт, w пожелание,
                  q вопрос дня, ph фото-задание, zg загадка (a — ответ), m музыка, l лягушка дня
   r — редкость: нет — обычная, 1 — редкая ✦, 2 — легендарная ★
   t — короткая надпись на колесе, x — полный текст.
   ВАЖНО: новые карточки добавлять только В КОНЕЦ списка. История хранится по номерам. */
const DB = [
 {c:"k",t:"Созвон",x:"Внеочередной созвон в любое время, когда захочешь. Андрей обязан ответить, даже если он в этот момент ест. Особенно если ест."},
 {c:"k",t:"Стих на заказ",x:"Стихотворение на любую тему. Хоть про кабачок, хоть про лекцию по ОРГ. Срок исполнения: сутки."},
 {c:"k",t:"Выбор фильма",x:"Право выбрать фильм для следующего совместного просмотра. Андрей не имеет права вздыхать и говорить «ну ладно»."},
 {c:"k",t:"Ты права",x:"Однократное признание Андреем того, что ты права. В любом споре. Даже если он уверен в обратном. Особенно тогда."},
 {c:"k",r:1,t:"Обнимашки",x:"Десять минут непрерывных обнимашек при встрече. Не сгорает. Суммируется с другими купонами."},
 {c:"k",r:1,t:"Рисунок",x:"Андрей рисует тебе картину. Сам. Руками. Оценку ставишь ты, а он обещает не обижаться."},
 {c:"k",r:1,t:"Желание",x:"Одно желание. В пределах разумного. Ну, почти разумного."},
 {c:"k",r:1,t:"Письмо",x:"Длинное письмо в духе девятнадцатого века. С обращением «милостивая государыня» и без единого смайлика."},
 {c:"k",t:"Поцелуи",x:"Двадцать поцелуев при встрече. Распределение по лицу — на твоё усмотрение."},
 {c:"k",t:"Поныть",x:"Право целый вечер ныть Андрею о чём угодно. Он будет слушать, кивать и говорить «ужас какой»."},
 {c:"k",t:"Вкусняшка",x:"Андрей отправляет тебе что-нибудь вкусное. Что именно, выбираешь ты."},
 {c:"k",t:"Тишина",x:"Можно целый день не отвечать на одно сообщение, и Андрей не будет переживать. Ну, будет, но очень тихо."},

 {c:"c",t:"Улыбка",x:"Учёные до сих пор не могут объяснить, почему от твоей улыбки в комнате становится светлее. Я не учёный, но объясню: это просто ты."},
 {c:"c",t:"Разведка",x:"По данным разведки, сегодня ты самая красивая девушка в радиусе двух тысяч километров. Разведка проверяла лично."},
 {c:"c",t:"Голос",x:"Твой голос — единственный звук, ради которого я готов снять наушники посреди любимой песни."},
 {c:"c",t:"Справка",x:"Справка.\nДана Юле в том, что она умница.\nВыдана для предъявления куда угодно. Срок действия не ограничен."},
 {c:"c",t:"Наблюдение",x:"Ты умеешь делать сложные вещи так, будто они простые. Это редкий талант. Я долго наблюдал."},
 {c:"c",t:"Руки",x:"Твои руки умеют рисовать, вязать, писать конспекты и обнимать. Последнее — лучшее."},
 {c:"c",t:"Понедельник",x:"Факт: рядом с тобой даже понедельник ведёт себя прилично."},
 {c:"c",t:"Горячий чай",x:"Ты как горячий чай в холодный день. Только лучше, потому что чай не умеет смеяться над моими шутками."},
 {c:"c",t:"Признание",x:"Я иногда перечитываю нашу старую переписку и улыбаюсь как дурак. Вот. Признался."},
 {c:"c",t:"Сила",x:"Ты гораздо сильнее, чем думаешь. Я знаю, я видел, через что ты проходишь. И как."},
 {c:"c",t:"Глаза",x:"Если бы у красоты был размер, твои глаза не влезли бы ни в одну линейку. Даже в длинную, деревянную."},
 {c:"c",t:"Не идеально",x:"Тебе можно быть неидеальной. Ты всё равно лучшая. Это не обсуждается."},

 {c:"a",t:"Нейроны",x:"Встречаются два нейрона в голове студентки.\n— Ты чего такой уставший?\n— Анатомия. А ты?\n— Анатомия.\n— А третий где?\n— В отпуске до сессии."},
 {c:"a",t:"Кости",x:"— Сколько костей в человеческом теле?\n— Двести шесть.\n— А в моём после физры?\n— Тоже двести шесть. Просто болят все."},
 {c:"a",t:"Квадрат",x:"Художник продаёт картину:\n— Это «Чёрный квадрат».\n— Но он же белый!\n— Я художник, я так вижу. И краска кончилась."},
 {c:"a",t:"Голубь",x:"Голубь говорит другому:\n— Люди считают, что мы разносим заразу.\n— Обидно.\n— Ага. Я, между прочим, разношу только хорошие новости. И крошки."},
 {c:"a",t:"Буква Ё",x:"Буква Ё приходит к психологу:\n— Меня постоянно заменяют.\n— Кто?\n— Е.\n— И давно это с вами?\n— С тех пор как придумали клавиатуру."},
 {c:"a",t:"Посуда",x:"— Почему ты не моешь посуду?\n— Я жду, пока она сама осознает свои ошибки."},
 {c:"a",t:"Кисточка",x:"Кисточка жалуется палитре:\n— Меня уже месяц не берут в руки.\n— Не переживай. Ручку тоже скоро бросят.\n— Почему?\n— Сессия закончится."},
 {c:"a",t:"Чайник",x:"Чайник в общаге закипел в третий раз. Никто не пришёл.\nОн тихо подумал: «Может, дело во мне?»"},
 {c:"a",t:"Сердце",x:"Преподаватель медицины:\n— Что вы сделаете, если у человека остановилось сердце?\n— Сначала проверю, не влюблён ли он. Иногда оно просто так замирает."},
 {c:"a",t:"Английский",x:"— Как по-английски «я устала»?\n— I'm tired.\n— А «очень устала»?\n— I'm very tired.\n— А «у меня четыре пары, анатомия и соседка»?\n— Это не переводится. Это чувствуется."},
 {c:"a",t:"Голубь-турист",x:"Питерский голубь прилетел в Армавир.\n— Ну как тут у вас?\n— Солнце, тепло, семечки.\n— А дождь?\n— Бывает.\n— Раз в неделю?\n— Раз в месяц.\nГолубь заплакал и попросил политического убежища."},
 {c:"a",t:"По очереди",x:"— Как вы справляетесь с отношениями на расстоянии?\n— Договорились скучать по очереди.\n— И как?\n— Не получается. Оба всё время на смене."},
 {c:"a",t:"Зебра",x:"Художник третий час рисует зебру.\n— Почему так долго?\n— Не могу решить: она белая в чёрную полоску или чёрная в белую.\n— Какая разница?\n— Огромная. От этого зависит, какой краски покупать больше."},
 {c:"a",t:"Кот и кости",x:"Кот три часа смотрел, как хозяйка учит анатомию.\nВ конце он грустно подумал: «Двести шесть костей. И ни одной для меня»."},
 {c:"a",t:"Талон 847",x:"Мужик берёт в МФЦ талон. Номер 847. На табло 112.\nОн вздыхает и говорит соседу:\n— Ну что, давайте знакомиться.\nЧерез три часа у них были общий термос, общие шутки и общий план на пенсию."},
 {c:"a",t:"Дисциплина",x:"Студентку педагогического спрашивают:\n— Как вы будете держать дисциплину в классе?\n— Буду смотреть на детей так же, как бабушка смотрела на меня, когда я не доедала суп."},

 {c:"z",t:"Облако",x:"Нарисуй на полях конспекта маленькое облако. Можно кривое. Главное, чтобы твоё."},
 {c:"z",t:"Небо",x:"Сфотографируй небо над собой и отправь Андрею. Он сделает то же самое. Сравним, у кого красивее. (У тебя.)"},
 {c:"z",t:"Чай без всего",x:"Выпей чашку чая без телефона. Пять минут. Только ты и чай. Телефон подождёт, Андрей тоже."},
 {c:"z",t:"Похвала",x:"Напиши три вещи, за которые ты сегодня себя хвалишь. Даже если одна из них «я встала». Это считается."},
 {c:"z",t:"Песня",x:"Отправь Андрею песню, которая сейчас крутится у тебя в голове. Без объяснений."},
 {c:"z",t:"Окно",x:"Посмотри в окно ровно одну минуту и найди там что-нибудь смешное. Оно там точно есть."},
 {c:"z",t:"Портрет",x:"Нарисуй Андрея за тридцать секунд. Чем хуже, тем лучше. Отправь ему, он повесит на стену."},
 {c:"z",t:"Спать раньше",x:"Сегодня ляжешь спать на полчаса раньше. Это не просьба. Это решило колесо."},
 {c:"z",t:"Кружок",x:"Запиши Андрею кружок, в котором ты молча машешь рукой. Десять секунд. Ничего не объясняй."},
 {c:"z",t:"Просто так",x:"Купи себе что-нибудь вкусное просто так. Не за что-то. Просто потому что сегодня такой день."},

 {c:"p",t:"Незнакомец",x:"Сегодня тебе улыбнётся незнакомец. Возможно, это будет кот. Котам тоже можно."},
 {c:"p",t:"Знак свыше",x:"Увидишь сегодня голубя — к хорошим новостям. Двух — к очень хорошим. Стаю — беги, это уже не знак, а засада."},
 {c:"p",t:"Звёзды",x:"Звёзды сообщают: сегодня у тебя всё получится. Звёзды далеко и плохо видят, но в этот раз уверены."},
 {c:"p",t:"Чаинки",x:"По чаинкам видно: преподаватель сегодня будет добрым. Чаинки редко ошибаются. Чаще ошибаются преподаватели."},
 {c:"p",t:"Скоро",x:"В ближайшие дни тебя ждёт неожиданная радость. Масштаб — от конфеты в кармане до чего-то побольше."},
 {c:"p",t:"Шар судьбы",x:"Магический шар отвечает на твой вопрос: «Да». Какой бы ни был вопрос. Шар сегодня в хорошем настроении."},
 {c:"p",t:"Вероятность",x:"Вероятность хорошего настроения сегодня — 97%. Оставшиеся 3% уйдут на английский."},
 {c:"p",t:"Гороскоп",x:"Гороскоп для всех знаков зодиака по имени Юля: день благоприятен для отдыха, вкусной еды и мыслей об одном человеке из Питера."},
 {c:"p",t:"Гуща",x:"На дне чашки видна фигура. Похоже на сердце. Или на картошку. Знатоки говорят, что это одно и то же."},
 {c:"p",t:"Видение",x:"Мне было видение: ты, тёплый плед и никаких дедлайнов. Видение пока не сбылось, но активно над этим работает."},

 {c:"f",t:"Выдры",x:"Морские выдры спят, держась за лапки, чтобы их не унесло течением. Вот бы и нам так. Прямо сейчас."},
 {c:"f",t:"Осьминог",x:"У осьминога три сердца. И всё равно по количеству любви к тебе он бы мне проиграл."},
 {c:"f",t:"Вомбаты",x:"Вомбаты какают кубиками. Это правда. Не знаю, зачем тебе это знание, но теперь оно с тобой навсегда."},
 {c:"f",t:"Мёд",x:"Мёд не портится: археологи находили в гробницах мёд, которому тысячи лет. Моя любовь к тебе работает примерно так же."},
 {c:"f",t:"Коровы",x:"У коров бывают лучшие подруги, и они грустят, когда их разлучают. Передай Полине."},
 {c:"f",t:"Облака",x:"Обычное кучевое облако весит сотни тонн. И всё равно летает. Так что и ты справишься с любым грузом."},
 {c:"f",t:"Улитки",x:"Улитки могут проспать несколько месяцев подряд. Просто чтобы ты знала, к чему стремиться в воскресенье."},

 {c:"w",t:"Светофоры",x:"Пусть сегодня все светофоры будут зелёными, очереди короткими, а перерывы между парами — подлиннее."},
 {c:"w",t:"Тепло",x:"Пусть тебе сегодня будет тепло. Снаружи — от одежды, внутри — от того, что тебя любят."},
 {c:"w",t:"Сон",x:"Пусть сегодня ночью тебе приснится что-то такое, что утром захочется рассказать."},
 {c:"w",t:"Силы",x:"Пусть сил хватит на всё, что нужно, и ещё немного останется на то, что хочется."},
 {c:"w",t:"Мелочь",x:"Желаю тебе маленькой радости. Совсем маленькой: тёплого носка, последней конфеты, удачной строчки."},
 {c:"w",t:"Краски",x:"Пусть скоро найдётся вечер, когда можно просто сесть и рисовать. Без оценок, без сроков. Для себя."},
 {c:"w",t:"Люди",x:"Пусть сегодня рядом будут только хорошие люди. А плохие пусть останутся дома с лёгким насморком."},
 {c:"w",r:1,t:"Секрет",x:"Секретное пожелание: [скрыто].\nУзнаешь при встрече. Да, это шантаж."},

 /* ======== НОВОЕ (октябрь 2026). Порядок старых карточек не трогать: по номерам хранится история ======== */
 /* --- купоны --- */
 {c:"k",t:"5 комплиментов",x:"Андрей обязан за одну минуту написать тебе пять комплиментов. Без повторов. Время пошло, как только ты покажешь купон."},
 {c:"k",t:"Мем-доставка",x:"Доставка десяти отборных мемов. Андрей лично отбирает каждый. Если ни один не рассмешил — доставка повторяется бесплатно."},
 {c:"k",t:"Голосовое утро",x:"Завтра утром тебя разбудит голосовое от Андрея. Не просто «доброе утро», а целое утреннее шоу."},
 {c:"k",t:"Сказка",x:"Андрей сочиняет тебе сказку на ночь. Главный герой — на твой выбор. Хоть чайник, хоть староста этажа."},
 {c:"k",t:"Конец спора",x:"Мгновенно завершает любой спор в твою пользу. Андрей говорит «да, дорогая» и даже не вздыхает."},
 {c:"k",t:"Тема вечера",x:"Ты выбираешь тему для вечернего разговора. Андрей обязан поддерживать её не меньше получаса. Даже если тема — гуашь."},
 {c:"k",t:"Смешное фото",x:"Андрей присылает своё фото в самой нелепой позе, которую ты придумаешь. Без права удаления."},
 {c:"k",t:"Анекдот",x:"Анекдот на заказ. Ты называешь тему, Андрей придумывает. Если не смешно — хотя бы старательно."},
 {c:"k",t:"Ты поела?",x:"Целый день Андрей не спрашивает «ты поела?». Ну, почти. Он будет очень стараться."},
 {c:"k",r:1,t:"Мини-посылка",x:"Андрей отправляет тебе маленькую посылку с сюрпризом. Что внутри — секрет. Размер — маленький, любовь — большая."},
 {c:"k",r:1,t:"Доставка еды",x:"Андрей заказывает тебе еду с доставкой. Ты выбираешь что. Он выбирает, что не будет смотреть на чек."},
 {c:"k",r:1,t:"Мультик",x:"Новый мультфильм про тебя. Андрей заказывает, сюжет — на твой выбор. Ждать придётся пару дней, зато будет красиво."},
 {c:"k",r:1,t:"Сайт-подарок",x:"Андрей делает для тебя новую страничку-подарок. Тема — какая захочешь: игра, открытка, галерея."},
 {c:"k",r:2,t:"Подарок",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nВнеплановый подарок. Без повода, без праздника, просто потому что колесо так решило. Андрей уже нервно открыл маркетплейс."},
 {c:"k",r:2,t:"Желание+",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nЖелание без ограничений. Ну, почти без ограничений: в пределах законов физики и бюджета студента."},
 {c:"k",r:2,t:"День королевы",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nЦелый день ты королева. Андрей — придворный: исполняет капризы, пишет оды и обращается к тебе только «ваше величество»."},
 {c:"k",r:2,t:"Свидание",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nСвидание на расстоянии: Андрей заказывает вам одинаковую еду, вы смотрите один фильм и болтаете весь вечер. Ресторан длиной 2000 км."},
 {c:"k",r:2,t:"Песня",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nАндрей поёт тебе песню. Видео. Голосом. Каким есть. Срок исполнения — когда наберётся смелости, но не позже чем через неделю."},
 {c:"k",r:2,t:"Сюрприз",x:"ЛЕГЕНДАРНЫЙ КУПОН.\nСюрприз. Какой — Андрей пока сам не знает. Но знает, что он будет. Жди."},

 /* --- комплименты --- */
 {c:"c",t:"Смех",x:"Твой смех надо выдавать по рецепту. Он лечит лучше любой аптечки."},
 {c:"c",t:"Акварель",x:"Ты рисуешь акварелью, а я смотрю на тебя и понимаю, что лучшая картина в мире — это ты, когда сосредоточенно рисуешь."},
 {c:"c",t:"Учительница",x:"Детям очень повезёт. У них будет учитель, который объяснит что угодно и при этом не забудет улыбнуться."},
 {c:"c",t:"Упрямство",x:"Ты бываешь упрямой. И это прекрасно: именно поэтому у тебя всё получается."},
 {c:"c",t:"Доброта",x:"Ты добрая даже тогда, когда устала. Это самый редкий вид доброты."},
 {c:"c",t:"Сообщения",x:"Когда приходит сообщение от тебя, телефон вибрирует как обычно. А я — нет. Я подпрыгиваю."},
 {c:"c",t:"Красота",x:"Ты красивая. Это не комплимент, это констатация. Комплимент будет дальше: ты ещё и умная."},
 {c:"c",r:1,t:"Тайна",x:"Самая большая тайна вселенной: как в одном человеке помещается столько всего хорошего. Учёные бессильны. Я просто радуюсь."},

 /* --- анекдоты --- */
 {c:"a",t:"Филолог",x:"Филолог заходит в кафе:\n— Мне, пожалуйста, кофе.\n— Чёрный?\n— Мужского рода. Но сегодня можно и чёрный."},
 {c:"a",t:"Бесконечность",x:"Студента-программиста попросили объяснить, что такое бесконечный цикл. Он показал переписку с девушкой:\n«Отключайся первая» — «Нет, ты» — «Нет, ты» — «Ну на счёт три…»"},
 {c:"a",t:"Отличница",x:"— Почему ты так долго делаешь домашку?\n— Я её не делаю. Я её довожу до совершенства.\n— И сколько осталось?\n— Вся жизнь."},
 {c:"a",t:"Расстояние",x:"Расстояние решило разлучить одну пару. Поставило между ними 2000 км. Через месяц заглянуло проверить — а они переписываются по 148 сообщений в день. Ещё через месяц расстояние уволилось."},
 {c:"a",t:"Лягушка",x:"Лягушка приходит к врачу:\n— Доктор, мне кажется, я принцесса.\n— Это лечится.\n— Не надо лечить. У меня уже есть принц. Он просто пока в Питере."},
 {c:"a",t:"Не вместе",x:"Учительница русского:\n— Какое слово всегда пишется раздельно?\nВовочка:\n— «Не вместе».\n— Почему?\n— Потому что не вместе всегда тяжело."},
 {c:"a",t:"Гуашь",x:"Акварель спрашивает гуашь:\n— Почему ты такая непрозрачная?\n— Я не непрозрачная. Я загадочная."},
 {c:"a",t:"Будильник",x:"Будильник прозвенел в седьмой раз.\nХозяйка открыла один глаз и сказала:\n— Ещё пять минут.\nБудильник вздохнул:\n— Это я уже слышал. В 6:40, 6:45, 6:50…"},

 /* --- задания --- */
 {c:"z",t:"Каракуля",x:"Нарисуй каракулю с закрытыми глазами, а потом преврати её в животное. Отправь Андрею, пусть угадает, кто это."},
 {c:"z",t:"Комплимент",x:"Сделай сегодня комплимент одному человеку. Любому. Можно соседке. Особенно соседке."},
 {c:"z",t:"Танец",x:"Станцуй под одну песню. Одна, в комнате, как будто никто не видит. Потому что никто и не видит."},
 {c:"z",t:"Три кадра",x:"Расскажи Андрею свой день в трёх эмодзи. Он попробует угадать, что было."},
 {c:"z",t:"Стакан воды",x:"Выпей стакан воды прямо сейчас. Колесо следит за твоим водным балансом."},
 {c:"z",t:"Плед",x:"Сегодня вечером — десять минут под пледом, ничего не делая. Это задание, и его нельзя провалить."},
 {c:"z",t:"Лист",x:"Найди на улице самый красивый осенний лист и сфотографируй его. Или забери — на память."},
 {c:"z",r:1,t:"Письмо себе",x:"Напиши письмо себе через год. Три строчки. Спрячь. Андрей обещает напомнить открыть его через 365 дней."},

 /* --- предсказания --- */
 {c:"p",t:"Пара",x:"Сегодня одну пару могут отменить. А может, и нет. Но надеяться не запрещено."},
 {c:"p",t:"Лягушка",x:"Предсказание: сегодня ты увидишь что-то зелёное, и оно тебя порадует. Возможно, это будет лягушка. Возможно, светофор."},
 {c:"p",t:"Звонок",x:"Вечером тебе позвонит человек, который очень по тебе скучает. Подсказка: он живёт в Питере и любит блины."},
 {c:"p",t:"Удача",x:"Сегодня удача на твоей стороне. Она, правда, немного опаздывает, но уже в пути."},
 {c:"p",t:"Сон",x:"Этой ночью тебе приснится что-то тёплое. Если приснится сессия — это ошибка, жалобы принимает Андрей."},
 {c:"p",t:"Вкусно",x:"Сегодня ты съешь что-то очень вкусное. Звёзды настаивают. Не спорь со звёздами."},
 {c:"p",t:"Магнит",x:"Сегодня ты будешь притягивать хорошее. Плохое тоже попробует, но отскочит."},
 {c:"p",r:1,t:"Будущее",x:"Большое предсказание: летом будет поездка, Нева, разводные мосты и один очень счастливый человек рядом. Это не предсказание. Это план."},

 /* --- факты --- */
 {c:"f",t:"Пингвины",x:"Пингвины некоторых видов дарят избраннице красивые камешки. Я бы подарил тебе целый пляж."},
 {c:"f",t:"Коалы",x:"Коалы спят до 20 часов в сутки. Это не лень, это стиль жизни. Можно брать пример в выходные."},
 {c:"f",t:"Совы",x:"Совы не умеют двигать глазами, поэтому поворачивают голову почти на 270 градусов. Полина оценит."},
 {c:"f",t:"Бабочки",x:"Бабочки чувствуют вкус лапками. Представь: встала на торт — и уже всё поняла."},
 {c:"f",t:"Лягушки пьют",x:"Лягушки не пьют воду ртом: они впитывают её кожей. Очень удобно, если лень идти за стаканом."},
 {c:"f",t:"Морской конёк",x:"У морских коньков потомство вынашивают папы. Вот это я понимаю — забота."},
 {c:"f",t:"Вороны",x:"Вороны запоминают лица людей и могут годами помнить, кто был к ним добр. Будь доброй к воронам."},
 {c:"f",t:"Арбуз",x:"С точки зрения ботаники арбуз и банан — ягоды, а клубника — нет. Мир полон обмана."},
 {c:"f",t:"Венера",x:"На Венере сутки длятся дольше, чем год. Так что если тебе кажется, что пара тянется вечность, — ты почти на Венере."},
 {c:"f",t:"Акулы",x:"Акулы появились на Земле раньше, чем деревья. Им можно доверять: они видели всё."},

 /* --- пожелания --- */
 {c:"w",t:"Лёгкость",x:"Пусть сегодня всё даётся легко. А то, что не даётся, пусть просто подождёт до завтра."},
 {c:"w",t:"Чай",x:"Пусть сегодняшний чай будет идеальной температуры с первого глотка."},
 {c:"w",t:"Похвала",x:"Пусть сегодня тебя похвалят. А если забудут — я похвалю за всех: ты молодец."},
 {c:"w",t:"Время",x:"Пусть сегодня найдётся час только для тебя. Без пар, без дел, без чужих голосов."},
 {c:"w",t:"Батарея",x:"Пусть батарея в комнате греет, Wi-Fi ловит, а соседи шумят ровно на два тона тише."},
 {c:"w",t:"Вдохновение",x:"Пусть сегодня придёт вдохновение. И пусть оно придёт вовремя, а не в два часа ночи."},
 {c:"w",t:"Сон",x:"Желаю выспаться. Не «немного поспать», а именно выспаться. Как в детстве на каникулах."},
 {c:"w",r:1,t:"Мечта",x:"Пусть сегодня ты сделаешь хотя бы маленький шаг к своей мечте. Даже если это просто купленный тюбик краски."},

 /* --- вопрос дня (новая категория) --- */
 {c:"q",t:"Суперсила",x:"Какую суперсилу ты бы выбрала, чтобы выживать на парах?"},
 {c:"q",t:"Утро-зверь",x:"Какое животное лучше всего описывает твоё сегодняшнее утро?"},
 {c:"q",t:"Первый рисунок",x:"Что ты нарисуешь первым делом, когда наконец будет свободный вечер?"},
 {c:"q",t:"Фильм",x:"Какой фильм мы посмотрим первым, когда встретимся?"},
 {c:"q",t:"Герб",x:"Если бы у нашей пары был герб, что было бы на нём нарисовано?"},
 {c:"q",t:"Мелочь",x:"Какая самая маленькая вещь порадовала тебя сегодня?"},
 {c:"q",t:"Блюдо",x:"Какое блюдо ты бы приготовила мне в первую очередь?"},
 {c:"q",t:"Питер",x:"Куда мы пойдём в Питере в первый же день?"},
 {c:"q",t:"Песня недели",x:"Какая песня лучше всего описывает твою неделю?"},
 {c:"q",t:"Телепорт",x:"Если бы можно было телепортироваться на один час, куда бы ты отправилась?"},

function pickResult(r,forced){
  const seen=new Set(hist().filter(e=>e.i!=null).map(e=>e.i));
  const x=r();let t=forced!=null?forced:(x<.035?2:x<.19?1:0);
  for(let tt=t;tt>=0;tt--){const pool=idx.filter(i=>tier(i)===tt&&!seen.has(i));if(pool.length)return pool[Math.floor(r()*pool.length)]}
  const pool=idx.filter(i=>tier(i)===t);return pool[Math.floor(r()*pool.length)];
}
function buildDay(forced){
  const r=Math.random, sp=specialFor(today);
  let res=sp?-1:pickResult(r,forced);
  const others=shuffle(idx.filter(i=>i!==res&&tier(i)===0),r);
  const picked=[];const perCat={};if(res>=0)perCat[DB[res].c]=1;
  const tease=[];if(r()<.45){const rr=idx.filter(i=>tier(i)===1&&i!==res);tease.push(rr[Math.floor(r()*rr.length)])}
  if(r()<.18){const lg=idx.filter(i=>tier(i)===2&&i!==res);tease.push(lg[Math.floor(r()*lg.length)])}
  tease.forEach(i=>{if(i!=null&&!picked.includes(i))picked.push(i)});
  for(const i of others){if(picked.length>=7)break;const c=DB[i].c;if((perCat[c]||0)>=2)continue;perCat[c]=(perCat[c]||0)+1;picked.push(i)}
  const slots=shuffle([res,...picked.slice(0,7)],r);
  return {k:KEY,slots,res,sp:sp?sp.key:null,j:r()*24-12};
}

  const act=list.filter(x=>!used[x.e.k+":"+x.e.i]),done=list.filter(x=>used[x.e.k+":"+x.e.i]);
  $("cpCount").textContent=act.length?`Действующих: ${act.length}`:"";
  const row=(x,u)=>`<div class="coupon ${x.it.r===2?"leg":x.it.r===1?"rare":""} ${u?"used":""}"><div><b>${esc(x.it.t)}</b><small>${esc(x.it.x)}</small><small class="d">${x.e.k.split("-").reverse().slice(0,2).join(".")}${u?" · погашен "+esc(u):""}</small></div>${u?"":`<button class="btn mini" data-id="${x.e.k}:${x.e.i}">Погасить</button>`}</div>`;
  $("coupons").innerHTML=list.length?(act.map(x=>row(x,null)).join("")+(done.length?`<h3>Погашенные</h3>`+done.map(x=>row(x,used[x.e.k+":"+x.e.i])).join(""):""))
    :`<p class="empty">Купонов пока нет. Они выпадают на колесе, а самые крупные — легендарные ★</p>`;
  $("coupons").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{if(!confirm("Погасить купон? Сначала сделай скриншот и отправь Андрею 😉"))return;
    const u=J("used",{});u[b.dataset.id]=today.getDate()+" "+MONTHS[today.getMonth()];store.set("used",JSON.stringify(u));renderCoupons()});
}

/* ---------- коллекция ---------- */
function renderColl(){
  const got=new Set(hist().filter(e=>e.i!=null).map(e=>e.i));const sps=hist().filter(e=>e.s);
  const cats=Object.keys(CAT).filter(c=>c!=="s");
  $("collTotal").innerHTML=`Собрано <b>${got.size}</b> из ${N}<div class="prog"><i style="width:${got.size/N*100}%"></i></div>`;
  $("coll").innerHTML=cats.map(c=>{const its=idx.filter(i=>DB[i].c===c);const g=its.filter(i=>got.has(i)).length;
    return `<details><summary>${CAT[c].name} <span>${g} / ${its.length}</span></summary><div class="cg">${its.map(i=>got.has(i)
      ?`<button class="ci ${tier(i)===2?"leg":tier(i)===1?"rare":""}" data-i="${i}">${esc(DB[i].t)}</button>`
      :`<span class="ci lock">${tier(i)===2?"★ ???":tier(i)===1?"✦ ???":"???"}</span>`).join("")}</div></details>`}).join("")
    +(sps.length?`<details open><summary>${CAT.s.name} <span>${sps.length}</span></summary><div class="cg">${sps.map(e=>`<button class="ci sp" data-s="${e.s}" data-k="${e.k}">${esc(itemOf(e).t)}</button>`).join("")}</div></details>`:"");
  $("coll").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>openCard(DB[+b.dataset.i]));
  $("coll").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>openCard(itemOf({s:b.dataset.s,k:b.dataset.k})));
}

/* ---------- эффекты ---------- */
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function confetti(gold){
  const cols=gold?["#ffd95e","#f5b82e","#fff3b0","#e9a23b","#ffffff"]:["#c8553d","#e9a23b","#8fb27a","#9b86c9","#6fa3c7","#f2c14e"];
  for(let i=0;i<(gold?110:60);i++){const s=document.createElement("span");s.className="confetti";
    s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];
    s.style.animationDuration=(2+Math.random()*2)+"s";s.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),4600)}
}
/* стрелка щёлкает на каждом секторе */
let tickRaf=0,lastSec=-1;
function angleNow(){const m=getComputedStyle(svg).transform;if(!m||m==="none")return 0;const v=m.match(/matrix\(([^)]+)\)/);if(!v)return 0;const [a,b]=v[1].split(",").map(Number);return (Math.atan2(b,a)*180/Math.PI+360)%360}
function tickLoop(){const a=angleNow(),sec=Math.floor(((360-a)%360)/45);if(sec!==lastSec){lastSec=sec;const p=$("pointer");p.classList.remove("tick");void p.offsetWidth;p.classList.add("tick");vib(4)}tickRaf=requestAnimationFrame(tickLoop)}

/* ---------- главный экран ---------- */
const btn=$("spin"),again=$("again"),timer=$("timer");
function tick(){const nxt=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1);let s=Math.max(0,Math.floor((nxt-new Date())/1000));if(s===0&&!fakeDate){location.reload();return}
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;timer.textContent=`Следующая прокрутка через ${h}:${pad(m)}:${pad(sec)}`}
let tickIv=0;
function setDone(){btn.disabled=true;btn.textContent="Сегодня уже крутили";again.style.display="inline-block";
  if(TEST){btn.disabled=false;btn.textContent="Крутить ещё (тест)";timer.textContent="Тестовый режим: крути сколько хочешь";return}
  tick();clearInterval(tickIv);tickIv=setInterval(tick,1000)}
function resultItem(){return day.res===-1?slotItem(-1):DB[day.res]}
function renderLetter(){const t=LETTERS[KEY];$("letter").style.display=t?"block":"none";if(t){$("letter").onclick=()=>openCard({c:"s",t:"Письмо на сегодня",x:t,r:3})}}
function renderAll(){renderHist();renderStreak();renderCoupons();renderColl()}
$("date").textContent="Сегодня "+today.getDate()+" "+MONTHS[today.getMonth()]+(specialFor(today)?" · особый день 🌟":"");
renderLetter();
if(store.get("spun-"+KEY)&&!TEST){svg.style.transition="none";svg.style.transform=`rotate(${finalAngle+day.j}deg)`;setDone();saveHist()}
renderAll();
let spinning=false,base=0;
btn.onclick=()=>{
  if(spinning||btn.disabled&&!TEST)return;
  if(TEST&&store.get("spun-"+KEY)){/* тест: новое колесо */day=buildDay(J("force",null));store.set("day",JSON.stringify(day));drawWheel();resultSlot=day.slots.indexOf(day.res);finalAngle=360-(resultSlot*45+22.5);
    svg.style.transition="none";svg.style.transform="rotate(0deg)";void svg.getBoundingClientRect();svg.style.transition=""}
  spinning=true;btn.disabled=true;btn.textContent="Крутится…";lastSec=-1;
  svg.style.transform=`rotate(${360*7+finalAngle+day.j}deg)`;tickRaf=requestAnimationFrame(tickLoop);
  setTimeout(()=>{
    cancelAnimationFrame(tickRaf);spinning=false;
    store.set("spun-"+KEY,"1");
    if(TEST){const h=hist();h.push(day.res===-1?{k:KEY,s:day.sp}:{k:KEY,i:day.res});store.set("hist",JSON.stringify(h))}else saveHist();
    const it=resultItem();vib(it.r>=2?[40,60,40,60,120]:[30,50,60]);
    confetti(it.r>=2);if(it.r>=2)document.body.classList.add("flash"),setTimeout(()=>document.body.classList.remove("flash"),900);
    renderAll();openCard(it,it.r===2?"Легендарная карточка! Такие выпадают примерно раз в месяц. ":it.r===1?"Редкая карточка! ":"");setDone();
  },5800);
};
again.onclick=()=>openCard(resultItem());
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  ["pWheel","pCoupons","pColl"].forEach(id=>$(id).style.display=id===b.dataset.p?"block":"none");window.scrollTo({top:0})});

/* ---------- пульт тестового режима ---------- */
if(TEST){
  const tp=$("testpanel");tp.style.display="block";
  const f=J("force",null);
  tp.innerHTML=`<b>🧪 Пульт проверки</b>
   <div class="row">Следующая прокрутка: ${["обычная","редкая","легендарная"].map((n,i)=>`<button class="tb ${f===i?"on":""}" data-f="${i}">${n}</button>`).join("")}<button class="tb ${f==null?"on":""}" data-f="">случайно</button></div>
   <div class="row">Дата: <input type="date" id="fd" value="${keyOf(today)}"> <button class="tb" id="fdreal">сегодня</button></div>
   <div class="row">Быстро к особым дням: <button class="tb" data-d="2026-11-20">20 ноября</button><button class="tb" data-d="2026-12-31">31 декабря</button><button class="tb" data-d="2027-03-08">8 марта</button><button class="tb" data-d="2027-06-07">7 июня</button><button class="tb" data-d="2027-08-20">год</button></div>
   <div class="row"><button class="tb" id="st6">Серия: добавить 6 прошлых дней</button><button class="tb" id="all">Открыть всю коллекцию</button><button class="tb" id="rst">Стереть тест</button></div>
   <p class="small">Это тестовое колесо. Его память отдельная, настоящее колесо Юли не трогается.</p>`;
  tp.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{store.set("force",b.dataset.f===""?"null":b.dataset.f);store.set("spun-"+KEY,"1");location.reload()});
  const setD=v=>{if(v)store.set("fakedate",v);else localStorage.removeItem(P+"fakedate");location.reload()};
  $("fd").onchange=e=>setD(e.target.value);$("fdreal").onclick=()=>setD("");
  tp.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>setD(b.dataset.d));
  $("st6").onclick=()=>{const h=hist();for(let k=1;k<=6;k++){const d=new Date(today);d.setDate(d.getDate()-k);const key=keyOf(d);if(!h.some(e=>e.k===key))h.unshift({k:key,i:Math.floor(Math.random()*N)})}store.set("hist",JSON.stringify(h));location.reload()};
  $("all").onclick=()=>{const h=hist();idx.forEach(i=>{if(!h.some(e=>e.i===i))h.push({k:"2026-01-01",i})});store.set("hist",JSON.stringify(h));location.reload()};
  $("rst").onclick=()=>{if(confirm("Стереть всю тестовую память?"))location.href=location.pathname+"?reset"+(/[?&]test/.test(location.search)?"&test":"")};
}

</script>
