<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Монстр под кроватью</title>
<meta name="theme-color" content="#0d0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0d0a1a;font-family:"Nunito",system-ui,sans-serif;color:#efe9ff;touch-action:none}
#room{position:fixed;inset:0;background:linear-gradient(#2a2346 0%,#251f3d 58%,#3a2c2a 58%,#2e2320 100%)}
/* окно с луной */
#win{position:absolute;left:50%;top:9%;width:150px;height:130px;margin-left:-75px;background:linear-gradient(#0e1838,#1d2a5a);border:8px solid #4b3d66;border-radius:6px;overflow:hidden}
#win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#4b3d66}
#win::after{content:"";position:absolute;top:50%;left:0;right:0;height:6px;margin-top:-3px;background:#4b3d66}
#win i{position:absolute;right:22px;top:16px;width:30px;height:30px;border-radius:50%;background:#fff3cf;box-shadow:0 0 18px 4px rgba(255,240,200,.4)}
#win b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.pump{position:absolute;font-size:30px;left:calc(50% + 90px);top:calc(9% + 96px)}
/* кровать */
#bed{position:absolute;left:4%;right:4%;top:50%;height:16%}
#bed .head{position:absolute;left:0;bottom:-6%;width:7%;height:150%;background:#6b4a3a;border-radius:10px 10px 0 0}
#bed .foot{position:absolute;right:0;bottom:-6%;width:5%;height:105%;background:#6b4a3a;border-radius:8px 8px 0 0}
#bed .mat{position:absolute;left:5%;right:3%;bottom:0;height:46%;background:#e8e2f2;border-radius:6px}
#bed .blanket{position:absolute;left:24%;right:3%;bottom:18%;height:66%;background:repeating-linear-gradient(90deg,#c9637f 0 18px,#d9768f 18px 36px);border-radius:14px 10px 6px 6px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15)}
#bed .pillow{position:absolute;left:8%;bottom:40%;width:18%;height:40%;background:#fff;border-radius:40%}
#bed .frame{position:absolute;left:5%;right:3%;bottom:-14%;height:16%;background:#5a3e30;border-radius:3px}
#under{position:absolute;left:9%;right:7%;top:calc(50% + 16% + 2.2%);height:20%}
.it{position:absolute;font-size:30px;transform:translate(-50%,-50%)}
#eyes{position:absolute;font-size:20px;letter-spacing:6px;transform:translate(-50%,-50%);z-index:6;filter:drop-shadow(0 0 6px #b9ff7a) brightness(1.2);animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{opacity:.9}94%,98%{opacity:0}}
/* темнота + фонарик */
#dark{position:fixed;inset:0;z-index:5;pointer-events:none;background:rgba(5,3,12,.96);transition:opacity 1.5s;
 -webkit-mask:radial-gradient(circle at var(--x,50%) var(--y,60%),transparent 0 46px,rgba(0,0,0,.6) 64px,#000 92px);
 mask:radial-gradient(circle at var(--x,50%) var(--y,60%),transparent 0 46px,rgba(0,0,0,.6) 64px,#000 92px)}
#top{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;z-index:8;transition:opacity .6s;pointer-events:none}
#top b{display:block;font:700 32px/1 "Caveat",cursive;color:#ffcf8a}
#top span{font-size:14px;opacity:.85}
#cnt{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;color:#ffcf8a;background:rgba(255,207,138,.12);border:1px solid rgba(255,207,138,.3);border-radius:20px;padding:2px 10px}
.note{position:fixed;z-index:9;background:#fff8ee;color:#3a2a20;font-size:13.5px;font-weight:700;padding:7px 11px;border-radius:12px;max-width:200px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none;animation:nt 2.8s ease forwards}
@keyframes nt{0%{opacity:0;transform:translateY(6px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
/* монстр */
#mon{position:fixed;z-index:7;width:120px;height:110px;left:50%;margin-left:-60px;display:none;transition:top 1.2s cubic-bezier(.3,1.3,.5,1),transform .3s}
#mon .bd{position:absolute;inset:0;border-radius:50% 50% 44% 44%;background:radial-gradient(circle at 40% 30%,#a58cff,#7457d6 60%,#5a3fb8);box-shadow:0 10px 24px rgba(0,0,0,.45)}
#mon .bd::before,#mon .bd::after{content:"";position:absolute;top:-10px;width:18px;height:22px;border-radius:50% 50% 0 0;background:#7457d6}
#mon .bd::before{left:24px;transform:rotate(-20deg)}#mon .bd::after{right:24px;transform:rotate(20deg)}
#mon .fc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;transition:transform .25s}
#mon .pw{position:absolute;bottom:-6px;font-size:22px}
#mon.hop .fc{transform:scale(1.15)}
#dlg{position:fixed;left:16px;right:16px;z-index:9;max-width:400px;margin:0 auto;background:#fff8ee;color:#3a2a20;border-radius:18px;padding:14px 16px;box-shadow:0 10px 26px rgba(0,0,0,.45);display:none;cursor:pointer}
#dlg p{font-size:16px;line-height:1.45;min-height:46px}
#dlg ul{list-style:none;padding:0;margin:6px 0 0}
#dlg li{font-size:15px;padding:4px 0}
#dlg small{display:block;text-align:right;font-size:12px;color:#a08a7a;margin-top:6px}
#dlg button{display:block;width:100%;margin-top:10px;font:800 16px "Nunito";border:none;border-radius:12px;padding:12px;background:#7457d6;color:#fff;cursor:pointer}
#end{position:fixed;inset:0;z-index:20;background:#05030c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;opacity:0;pointer-events:none;transition:opacity 2s}
#end.on{opacity:1;pointer-events:auto}
#end .e{font-size:54px;margin-bottom:12px}
#end h1{font:700 40px/1 "Caveat",cursive;color:#ffcf8a;margin-bottom:12px}
#end p{font-size:16px;line-height:1.5;max-width:330px;margin:5px 0;opacity:.9}
#end .s{font:700 24px "Caveat",cursive;color:#c9b8ff;margin-top:14px}
#end .gl{position:fixed;bottom:16%;font-size:18px;letter-spacing:6px;filter:drop-shadow(0 0 6px #b9ff7a);animation:blink 4s infinite}
</style>
</head>
<body>
<div id="room">
  <div id="win"><i></i></div>
  <div class="pump">🎃</div>
  <div id="bed"><div class="head"></div><div class="foot"></div><div class="frame"></div><div class="mat"></div><div class="pillow"></div><div class="blanket"></div></div>
  <div id="under"></div>
</div>
<div id="dark"></div>
<div id="top"><b>Монстр под кроватью</b><span>Под кроватью кто-то шуршит… Води пальцем, это фонарик 🔦</span><br><span id="cnt"></span></div>
<div id="mon"><div class="bd"></div><div class="fc" id="fc">🫣</div></div>
<div id="dlg"></div>
<div id="end"><div class="e">🌙</div><h1>Спокойной ночи</h1>
  <p>Под кроватью всё под контролем. Сегодня ночью тебя охраняют.</p>
  <p>А завтра Хэллоуин, так что если вдруг увидишь монстров, не бойся. Они все свои.</p>
  <div class="s">— Монстрик и Андрей</div><div class="gl">👀</div></div>
<script>
const $=id=>document.getElementById(id);
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
/* звёзды в окне */
for(let i=0;i<14;i++){const b=document.createElement("b");b.style.left=Math.random()*90+"%";b.style.top=Math.random()*90+"%";$("win").appendChild(b)}
/* находки под кроватью: позиция в % от области под кроватью */
const ITEMS=[
 {e:"🧦",x:12,y:62,t:"Потерянный носок! Так вот куда они все уходят"},
 {e:"🖍️",x:36,y:40,t:"Карандаш, пропавший много лет назад. Он скучал"},
 {e:"🪙",x:58,y:70,t:"Пять рублей на удачу. Оставь себе"},
 {e:"🕸️",x:76,y:30,t:"Паутинка. Монстр стесняется, обычно он убирается"}
];
const MON={x:90,y:55};
const under=$("under");
ITEMS.forEach(it=>{const d=document.createElement("div");d.className="it";d.textContent=it.e;d.style.left=it.x+"%";d.style.top=it.y+"%";under.appendChild(d);it.el=d});
const eyes=document.createElement("div");eyes.id="eyes";eyes.textContent="👀";under.appendChild(eyes);
function placeEyes(){const r=under.getBoundingClientRect();eyes.style.position="fixed";eyes.style.left=(r.left+r.width*MON.x/100)+"px";eyes.style.top=(r.top+r.height*MON.y/100)+"px"}
placeEyes();addEventListener("resize",placeEyes);
let found=0;const cnt=$("cnt");function upd(){cnt.textContent=`Найдено под кроватью: ${found} из ${ITEMS.length}`}upd();
/* фонарик */
let lx=innerWidth/2,ly=innerHeight*0.6,hold=0,state="search";
function setLight(x,y){lx=x;ly=y;$("dark").style.setProperty("--x",x+"px");$("dark").style.setProperty("--y",y+"px")}
setLight(lx,ly);
addEventListener("pointermove",e=>{if(state!=="search")return;setLight(e.clientX,e.clientY-40)});
addEventListener("pointerdown",e=>{if(state!=="search")return;setLight(e.clientX,e.clientY-40)});
let nq=Promise.resolve();function note(x,y,t){nq=nq.then(()=>new Promise(res=>{_note(x,y,t);setTimeout(res,1600)}))}
function _note(x,y,t){if(state!=="search")return;const n=document.createElement("div");n.className="note";n.textContent=t;n.style.left=Math.max(8,Math.min(innerWidth-208,x-100))+"px";n.style.top=(y-80)+"px";document.body.appendChild(n);setTimeout(()=>n.remove(),2900)}
let last=performance.now();
function loop(now){const dt=(now-last)/1000;last=now;
  if(state==="search"){
    const r=under.getBoundingClientRect();
    ITEMS.forEach(it=>{if(it.f)return;const x=r.left+r.width*it.x/100,y=r.top+r.height*it.y/100;
      if(Math.hypot(x-lx,y-ly)<42){it.f=true;found++;upd();buzz(15);note(x,y,it.t)}});
    const mx=r.left+r.width*MON.x/100,my=r.top+r.height*MON.y/100;
    if(Math.hypot(mx-lx,my-ly)<46){hold+=dt;if(hold>0.5)meet(mx,my)}else hold=Math.max(0,hold-dt);
  }
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* знакомство */
const D=[
 {f:"🫣",t:"Ой! Не свети так ярко, пожалуйста…"},
 {f:"😳",t:"Ты меня нашла. Обычно меня никто не находит. Я очень хорошо прячусь. Ну, почти."},
 {f:"🙂",t:"Не бойся. Я не страшный монстр. Я ночной охранник."},
 {f:"😌",t:"Каждую ночь я сижу тут и охраняю твой сон. Это моя работа, и я её очень люблю."},
 {f:"😤",t:"Вот кого я прогнал за последние ночи:",list:["👻 плохой сон про контрольную","⏰ будильник, который хотел зазвонить в 4 утра","🌀 мысль «а вдруг я что-то забыла»","🦠 последних вирусов, которые ещё прятались в углу"]},
 {f:"🎃",t:"Завтра Хэллоуин. Все монстры выйдут на улицы пугать людей. А я останусь здесь. Охранять тебя важнее."},
 {f:"🥺",t:"Можно одну просьбу? Ложись спать, пожалуйста. Когда ты спишь, мне спокойнее работается.",btn:"Спокойной ночи, монстрик"}
];
let di=0;
function meet(mx,my){
  state="talk";buzz([20,50,20]);
  $("dark").style.opacity=0.35;
  const m=$("mon");m.style.display="block";m.style.top=(my-55)+"px";m.style.left=mx+"px";m.style.marginLeft="-60px";m.style.transform="scale(.3)";
  eyes.style.display="none";$("top").style.opacity=0;
  setTimeout(()=>{m.style.transition="top 1.1s cubic-bezier(.3,1.3,.5,1),left 1.1s cubic-bezier(.3,1.3,.5,1),transform .9s";m.style.left="50%";m.style.top=(innerHeight*0.7-55)+"px";m.style.transform="scale(1)"},60);
  setTimeout(()=>{$("dark").style.opacity=0.2;say()},1300);
}
function say(){
  const d=D[di],dl=$("dlg");$("fc").textContent=d.f;
  const m=$("mon");m.classList.add("hop");setTimeout(()=>m.classList.remove("hop"),250);buzz(8);
  dl.style.display="block";
  dl.innerHTML=`<p>${d.t}</p>${d.list?`<ul>${d.list.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${d.btn?`<button id="bn">${d.btn}</button>`:"<small>нажми, чтобы слушать дальше ›</small>"}`;
  dl.style.top=Math.max(14,innerHeight*0.7-55-dl.offsetHeight-14)+"px";
  if(d.btn){$("bn").onclick=e=>{e.stopPropagation();bye()};dl.onclick=null}
  else dl.onclick=()=>{di++;say()};
}
function bye(){
  $("dlg").style.display="none";$("fc").textContent="🥱";buzz(15);
  setTimeout(()=>{$("fc").textContent="😴";$("mon").style.top=(innerHeight*0.76-55)+"px";$("mon").style.transform="scale(.8)"},1200);
  setTimeout(()=>{const dk=$("dark");dk.style.webkitMask="none";dk.style.mask="none";dk.style.opacity=1;dk.style.background="rgba(5,3,12,1)"},2200);
  setTimeout(()=>$("end").classList.add("on"),3400);
}
</script>
</body>
</html>
