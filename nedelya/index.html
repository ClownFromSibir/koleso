<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник недели</title>
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="nedelya.webmanifest">
<meta name="theme-color" content="#c8553d">
<link rel="icon" href="n8-icon-192.png">
<link rel="apple-touch-icon" href="n8-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Неделя 8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7efe1;--paper2:#fbf6ec;--ink:#3a2e28;--muted:#8a7a6d;--accent:#c8553d;--accent2:#9c3c29;--line:#e6d9c3;--blue:#5f8fb4;--ok:#6f9e5a;--bad:#c8553d;
  --card:#fff;--blueBg:#eef3f7;--blueLine:#cfdde8;--okBg:#e9f1e3;--badBg:#fbe9e4;--track:#e8dccb;--hud:rgba(247,239,225,.94);--glow1:rgba(233,162,59,.16);--glow2:rgba(95,143,180,.10)}
:root[data-theme="dark"]{--paper:#1d1916;--paper2:#28221e;--ink:#f1e7da;--muted:#a8998b;--accent:#e7795f;--accent2:#a94b36;--line:#3d342d;--blue:#86afd0;--ok:#8fc173;--bad:#e7795f;
  --card:#322a25;--blueBg:#1f2a32;--blueLine:#2f4150;--okBg:#243020;--badBg:#3a2420;--track:#3d342d;--hud:rgba(29,25,22,.94);--glow1:rgba(231,121,95,.10);--glow2:rgba(134,175,208,.08)}
:root[data-theme="aqua"]{--paper:#f1eef8;--paper2:#fbf9fe;--ink:#352f4a;--muted:#8a84a2;--accent:#8a6fd1;--accent2:#6450a3;--line:#e0d9ef;--blue:#6c8fd1;--ok:#5fa58a;--bad:#d16f8f;
  --card:#fff;--blueBg:#eef0fb;--blueLine:#d5dbf3;--okBg:#e6f4ee;--badBg:#fbe8ef;--track:#e4def2;--hud:rgba(241,238,248,.94);--glow1:rgba(209,111,143,.12);--glow2:rgba(108,143,209,.14)}
:root[data-theme="frog"]{--paper:#e8f0e1;--paper2:#f5faf0;--ink:#2d3828;--muted:#7a8a70;--accent:#4f8a3c;--accent2:#356127;--line:#d2e2c6;--blue:#4f8a8a;--ok:#4f8a3c;--bad:#c8553d;
  --card:#fff;--blueBg:#e6f1ee;--blueLine:#c9e0d8;--okBg:#e1f0d6;--badBg:#f7e4dd;--track:#d6e5ca;--hud:rgba(232,240,225,.94);--glow1:rgba(160,200,90,.18);--glow2:rgba(79,138,138,.12)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 10% 0%,var(--glow1),transparent 40%),radial-gradient(circle at 95% 45%,var(--glow2),transparent 45%);transition:background-color .3s,color .3s}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
button{font-family:inherit}
/* HUD */
.hud{position:sticky;top:0;z-index:5;background:var(--hud);backdrop-filter:blur(6px);margin:0 -16px 14px;padding:9px 16px 10px;border-bottom:1px solid var(--line);display:none}
.hud.show{display:block}
.hud .row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.hud .debt{white-space:nowrap;margin-left:auto}.menubtn{flex:none}
.hud .when{font-family:"Caveat",cursive;font-size:24px;color:var(--accent);line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .debt{margin-left:auto;font-size:13px;font-weight:800}
.bars{display:flex;gap:12px;margin-top:6px;font-size:13px;font-weight:800;align-items:center}
.bar{display:flex;align-items:center;gap:5px;flex:1}
.meter{flex:1;height:8px;border-radius:8px;background:var(--track);overflow:hidden;min-width:40px}
.meter i{display:block;height:100%;border-radius:8px;transition:width .4s}
/* cards */
.scene{background:var(--paper2);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 10px 30px rgba(90,60,30,.08);animation:in .3s ease}
.scene.blue{background:var(--blueBg);border-color:var(--blueLine)}
.scene.end{border:2px solid var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.scene h2{font-family:"Caveat",cursive;font-size:31px;margin:0 0 8px;line-height:1.05}
.scene p{font-size:17px;line-height:1.55;margin:0 0 12px;white-space:pre-line}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--badBg);border-radius:12px;padding:9px 12px;font-size:15px;margin-bottom:12px;white-space:pre-line}
.good{background:var(--okBg);border-radius:12px;padding:9px 12px;font-size:15px;margin-bottom:12px;white-space:pre-line}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{text-align:left;font-weight:700;font-size:16px;color:var(--ink);background:var(--card);transition:transform .08s,border-color .15s,background .2s;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:scale(.98)}
.choice small{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-top:2px}
.choice:disabled{opacity:.5;cursor:default;border-style:dashed}
.btn{display:block;margin:16px auto 0;font-weight:800;font-size:18px;color:#fff;background:var(--accent);border:none;border-radius:16px;padding:13px 30px;cursor:pointer;box-shadow:0 5px 0 var(--accent2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);box-shadow:none;font-size:15px;padding:9px 20px}
.slots{font-size:22px;letter-spacing:4px;margin:2px 0 8px}
/* hub */
h1{font-family:"Caveat",cursive;color:var(--accent);font-size:48px;line-height:1;margin:16px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 16px}
.sec{margin-top:16px}
.sec h3{font-family:"Caveat",cursive;font-size:28px;margin:0 0 6px}
.list{display:grid;gap:6px}
.list div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.list .no{color:var(--muted);opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
details summary{cursor:pointer;font-weight:700}
details.big{background:transparent;border:none;padding:0}
.tiny{font-size:11px;color:var(--muted);opacity:.6;text-align:center;margin-top:28px;letter-spacing:.2em}
/* minigames */
.speech{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.5;max-height:180px;overflow:auto;margin-bottom:12px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bcell{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:800;cursor:pointer;min-height:52px;word-break:break-word}
.bcell.on{background:#f6d6a8;border-color:#e9a23b}
.bcell.yes{background:var(--okBg);border-color:var(--ok)}
.bcell.wrong{background:var(--badBg);border-color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.word{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;cursor:pointer}
.word.ok{background:var(--okBg);border-color:var(--ok)}
.word.bad{background:var(--badBg);border-color:var(--bad)}
.track{position:relative;height:34px;border-radius:17px;background:var(--track);margin:16px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#b9d6a3}
.marker{position:absolute;top:3px;width:8px;height:28px;border-radius:4px;background:var(--ink);margin-left:-4px}
.opt.ok,.ok.choice{border-color:var(--ok)!important;background:var(--okBg)!important}
.opt.bad,.bad.choice{border-color:var(--bad)!important;background:var(--badBg)!important}
.fb{min-height:22px;font-weight:700;margin-top:10px;white-space:pre-line}
.sleep{height:16px;border-radius:8px;background:var(--track);overflow:hidden;margin:12px 0}
.sleep i{display:block;height:100%;background:#9b86c9;transition:width .1s linear}
.slide{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 12px;text-align:center;font-weight:800;min-height:64px}
.olist{display:grid;gap:6px;margin:8px 0}
.olist div{background:var(--okBg);border-radius:10px;padding:7px 12px;font-size:15px}
.shake{animation:shake .3s}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);z-index:40;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:.93}
/* tabs & menu */
.inmg .menubtn{visibility:hidden}
.choices .choice{animation:in .35s ease both}
.choices .choice:nth-child(2){animation-delay:.05s}.choices .choice:nth-child(3){animation-delay:.1s}.choices .choice:nth-child(4){animation-delay:.15s}.choices .choice:nth-child(5){animation-delay:.2s}.choices .choice:nth-child(n+6){animation-delay:.25s}
.scene.end{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--paper);font-size:11px;line-height:18px}
.coll{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;align-items:center}
.coll .mini{grid-column:1/-1;height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin:-2px 0 4px}
.coll .mini i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s ease}
.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.tabs{display:flex;gap:6px;margin:8px 0 14px;position:sticky;top:0;z-index:6;background:var(--hud);padding:8px 0;backdrop-filter:blur(6px)}
.tab{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 4px;font-weight:800;font-size:14px;cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--accent)}
.menubtn{border:none;background:none;font-size:22px;color:var(--ink);cursor:pointer;padding:0 0 0 8px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:800;cursor:pointer;color:var(--ink);background:var(--card);text-align:left}
.th.on{border-color:var(--accent)}
.th i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:3px;vertical-align:-2px}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.stats b{text-align:right;color:var(--accent)}
.ring{width:120px;height:120px;margin:4px auto 10px;display:block}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:13px;min-height:70px;cursor:pointer;transition:transform .15s}
.acard:active{transform:scale(.97)}
.acard b{display:block;font-size:14px;margin-bottom:3px}
.acard.got{border-color:var(--accent)}
.acard.new{animation:glow 1.6s ease 2}
.acard.lock{opacity:.6}
.acard .h{display:none;color:var(--muted);margin-top:4px}
.acard.open .h,.acard.lock:not(.sec) .h{display:block}
.toast.ach{background:linear-gradient(90deg,var(--accent),#e9a23b);animation:achpop .5s cubic-bezier(.2,1.6,.4,1)}
/* new minigames */
.tbar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:8px 0 12px}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .05s linear}
.qte{font-family:"Caveat",cursive;font-size:30px;text-align:center;margin:6px 0 10px;line-height:1.1}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid .choice{text-align:center;font-size:18px;padding:14px 6px}
.built{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.built span{width:30px;height:38px;border-bottom:3px solid var(--accent);text-align:center;font-weight:800;font-size:20px;line-height:38px}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.letters .word{min-width:42px;font-size:20px}
.letters .word:disabled{opacity:.25}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row2 .btn{margin-top:12px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcols>div{display:grid;gap:8px;align-content:start}
.mcols .choice{font-size:14px;padding:10px;text-align:center}
.choice.sel{border-color:var(--blue);background:var(--blueBg);transform:scale(1.03)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcard{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--line);background:var(--accent);color:transparent;font-weight:800;font-size:12px;cursor:pointer;transition:transform .3s,background .3s;padding:4px;word-break:break-word}
.mcard.up{background:var(--card);color:var(--ink);transform:rotateY(180deg)}
.mcard.up span{display:inline-block;transform:rotateY(180deg)}
.mcard.got{border-color:var(--ok);background:var(--okBg)}
.cwgrid{display:grid;gap:4px;margin:6px 0 12px}
.cw{display:flex;gap:3px}
.cw span{width:26px;height:30px;border:2px solid var(--line);border-radius:6px;text-align:center;font-weight:800;line-height:26px;background:var(--card)}
.cw span.key{border-color:var(--accent)}
.cw span.hint{color:var(--blue)}
.cw.cur span{border-color:var(--blue)}
.cw.cur span.key{border-color:var(--accent)}
.cwin{width:100%;font:700 20px "Nunito",sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-transform:uppercase}
/* boss */
.boss{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.bossface{font-size:46px;animation:wob 2s ease-in-out infinite}
.bossface.rage{animation:wob .5s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--bad))}
.bossface.hit{animation:shake .3s}
.hp{height:14px;border-radius:8px;background:var(--track);overflow:hidden;margin:4px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#e9a23b);transition:width .5s ease}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px var(--accent)}}
@keyframes achpop{from{transform:translate(-50%,30px) scale(.7);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:.95}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<main>
  <div class="hud" id="hud"></div>
  <div id="stage"></div>
</main>
<div class="toast" id="toast"></div>
<script src="nedelya-data.js?v=9"></script>
<script src="nedelya-quests.js?v=9"></script>
<script src="nedelya-secret.js?v=9"></script>
<script src="nedelya-games.js?v=9"></script>
<script>
/* ======================= БАЗА ======================= */
const $=id=>document.getElementById(id);
const R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const META_KEY="n8-meta", SAVE_KEY="n8-save", ART_MAX=8;

if(/[?&]reset/.test(location.search)){store.del(META_KEY);store.del(SAVE_KEY);location.replace(location.pathname)}

let meta=(()=>{try{return Object.assign({runs:0,ends:[],mg:[],mgVar:{},andrei:[],doklad:0,qSeen:[],qDone:{},hintLoop:0,deja:[],secret:[],ach:[]},JSON.parse(store.get(META_KEY)||"{}"))}catch(e){return {runs:0,ends:[],mg:[],mgVar:{},andrei:[],doklad:0,qSeen:[],qDone:{},hintLoop:0,deja:[],secret:[],ach:[]}}})();
const saveMeta=()=>store.set(META_KEY,JSON.stringify(meta));
let S=null;
const persist=()=>store.set(SAVE_KEY,JSON.stringify(S));

const THEMES={light:["Светлая","#f7efe1","#c8553d"],dark:["Тёмная","#1d1916","#e7795f"],aqua:["Акварель","#f1eef8","#8a6fd1"],frog:["Болотная","#e8f0e1","#4f8a3c"]};
function setTheme(t){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==="dark"?"dark":"light";store.set("n8-theme",t)}
setTheme(store.get("n8-theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"));
function confetti(){const cols=["#c8553d","#e9a23b","#8fb27a","#9b86c9","#6fa3c7","#f2c14e"];for(let i=0;i<60;i++){const s=document.createElement("span");s.className="confetti";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];s.style.animationDuration=(2+Math.random()*2)+"s";s.style.animationDelay=(Math.random()*.4)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4600)}}
function seen(cat,i){meta.seen=meta.seen||{};const a=meta.seen[cat]=meta.seen[cat]||[];if(!a.includes(i)){a.push(i);saveMeta()}}
function seenPick(cat,arr){const all=arr.map((x,i)=>i),fr=all.filter(i=>!((meta.seen||{})[cat]||[]).includes(i));const i=pick(fr.length&&R()<.75?fr:all);seen(cat,i);return arr[i]}
function stat(k,n){meta.st=meta.st||{};meta.st[k]=(meta.st[k]||0)+(n===undefined?1:n);saveMeta()}
function ach(id){
  meta.ach=meta.ach||[];if(meta.ach.includes(id))return;
  const a=ACH.find(x=>x.id===id);if(!a)return;
  meta.ach.push(id);meta.achNew=meta.achNew||[];meta.achNew.push(id);saveMeta();setTimeout(()=>toast("🏆 Достижение: "+a.n,true),400);
}
let toastT;
function toast(msg,isAch){const t=$("toast");t.textContent=msg;t.classList.remove("ach");void t.offsetWidth;if(isAch)t.classList.add("ach");t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show","ach"),isAch?3400:2600)}

/* ======================= ШКАЛЫ ======================= */
function fx(f){
  if(!f) return;
  const m=[];
  if(f.e){const was=S.e;S.e=clamp(S.e+f.e,0,10);if(S.e!==was)m.push((f.e>0?"+":"")+f.e+" ⚡")}
  if(f.m){S.m=clamp(S.m+f.m,0,10);m.push((f.m>0?"+":"")+f.m+" ☀️");if(S.m>=10)ach("inspire");if(S.m<=1)ach("blues")}
  if(f.a){S.a=clamp(S.a+f.a,0,ART_MAX);m.push("+"+f.a+" 🎨")}
  if(m.length) toast(m.join("   "));
  hud();
}
function C(){if(!S.cnt)S.cnt={tea:0,draw:0,sleep:0,cxl:0,eng:0,sup:0,snooze:0,frog:0,empty:0,flav:0,marg:0,mgw:0,idle:0,hearts:0,msgs:0,fam:0};return S.cnt}
function cnt(k,need,id){C();S.cnt[k]=(S.cnt[k]||0)+1;if(S.cnt[k]>=need)ach(id)}
function hud(when){
  if(when!==undefined) S._when=when;
  const h=$("hud");h.classList.add("show");
  const pending=S.hw.filter(x=>!x.done&&!x.failed).length;
  const mood=S.m>=8?" ✨":S.m<=2?" 🌧":"";
  h.innerHTML=`<div class="row"><span class="when">${esc(S._when||"")}${mood}</span>

  S={day:0,step:0,e:7,m:6,cnt:{tea:0,draw:0,sleep:0,cxl:0,eng:0,sup:0,snooze:0,frog:0,empty:0,flav:0,marg:0,mgw:0,idle:0,hearts:0,msgs:0,fam:0},cxlDay:{},late:-1,a:0,debts:0,hwDone:0,hw:[],hwId:0,mgRun:[],used:{morn:[],brk:[]},

  persist();runStep();
}
function buildDay(d){
  const st=["morning"];
  if(d<4) st.push("dv");
  for(let s=0;s<4;s++){st.push("pair"+s);if(s===1)st.push("break");if(s===3&&(S.quests||[]).some(id=>QUESTS[id].mid[d]))st.push("mid");if(S.andrei[d]===s)st.push("andrei")}
  if(d===4) st.push("boss","friday","sat","sun","final");
  else st.push("evening","night");
  return st;
}
function next(){S.step++;persist();runStep()}
function runStep(){
  if(!S.quests){S.quests=[];S.q={}}
  const steps=buildDay(S.day);
  if(S.step>=steps.length){S.day++;S.step=0;persist()}
  const st=buildDay(S.day)[S.step], d=S.day;
  if(st==="morning") return morning(d);
  if(st.startsWith("pair")) return pairStep(d,+st[4]);
  if(st==="break") return breakStep(d);
  if(st==="mid") return midStep(d,0);
  if(st==="andrei") return andreiStep(d);
  if(st==="evening") return evening(d);
  if(st==="night") return night(d);
  if(st==="friday") return friday();
  if(st==="dv") return dvStep(d);
  if(st==="boss") return S.bossDone?next():bossStart(false,()=>{S.bossDone=1;next()});
  if(st==="sat") return satStep();
  if(st==="sun") return sunStep();
  if(st==="final") return ending();
}
function rollDay(d){
  if(S.rolls[d]) return;
  S.rolls[d]=SCHED[d].map((k,s)=>{
    const pc=k==="rov"?.5:SUBJ[k].base==="hist"?.3:.07;
    const cancel=R()<pc;
    let eng=false;
    if(!cancel&&k!=="rov"&&S.engLeft>0&&R()<.12){eng=true;S.engLeft--}
    return {cancel,eng};
  });
}
function nextDue(base,d,s){
  if(base==="eng") return 99;
  for(let dd=d;dd<5;dd++)for(let ss=(dd===d?s+1:0);ss<4;ss++){if(SUBJ[SCHED[dd][ss]].base===base) return dd*10+ss}
  return 99;
}
function dueLabel(v){return v===99?"к концу недели":`сдать: ${DSHORT[Math.floor(v/10)]}, ${TIMES[v%10]}`}

  S.hw.forEach(h=>{if(h.base===base&&!h.done&&!h.failed&&h.due===d*10+s)h.due=nextDue(base,d,s)});

function afterPair(key,d,s,res){

function pickQuests(){
  const all=Object.keys(QUESTS);
  const fresh=shuffle(all.filter(k=>!meta.qSeen.includes(k)));
  const old=shuffle(all.filter(k=>meta.qSeen.includes(k)));
  return [...fresh,...old].slice(0,3);
}
function firstMid(id){return Math.min(...Object.keys(QUESTS[id].mid).map(Number))}
function midList(d){
  if(!S.quests) return [];
  return S.quests.filter(id=>{const Q=QUESTS[id],q=S.q[id];if(!Q.mid[d]||q["m"+d])return false;
    return d===firstMid(id)?q.st==="new":q.st==="active"});
}
let curD=0;
function midStep(d,k){
  curD=d;hud(`${DSHORT[d]} · после пар`);
  const L=midList(d);
  if(!L.length) return next();
  const id=L[0];S.q[id]["m"+d]=1;
  if(S.q[id].st==="new"&&d>firstMid(id))S.q[id].st="declined";
  persist();
  QUESTS[id].mid[d](S.q[id],()=>{persist();midStep(d,k+1)},d);
}

    const j=pick(g.jokes);qs.splice(Math.floor(R()*7)+1,0,{q:j[0],o:g.opts,a:-1,note:j[1]});
  }
  if(id==="anat") qs=shuffle(g.pool).slice(0,g.pick).map(x=>({q:x.q,o:x.o,a:x.a}));
  if(id==="lit") qs=shuffle(g.pool).slice(0,g.pick).map(([q,tr])=>{const o=shuffle([tr,...shuffle(g.tropes.filter(x=>x!==tr)).slice(0,2)]);return {q:"«"+q+"»",o,a:o.indexOf(tr)}});
  if(id==="det") qs=shuffle(g.pool).slice(0,g.pick).map(([q,n])=>{const o=shuffle([n,...shuffle(g.names.filter(x=>x!==n)).slice(0,3)]);return {q,o,a:o.indexOf(n)}});
  if(g.eng) qs=shuffle(g.pool).slice(0,g.pick).map(([w,r,f])=>{const o=[...shuffle([r,f]),"Я устала"];return {q:"Как переводится «"+w+"»?",o,a:o.indexOf(r),eng:1}});
  if(id==="omz") qs=qs.map(x=>{const right=x.o[x.a];const o=shuffle(x.o);return {q:x.q,o,a:o.indexOf(right)}});
  let i=0,score=0,left=g.timer?(g.timer+(S.m>=8?10:0)):0,timer=null,over=false,tired=0,honest=0,funny=0;
  const MYTH=["Запрокинуть голову назад","Намазать маслом","Дать запить водой","Растереть и бежать дальше","Прижечь","Подуть на язык","Уложить спать и забыть"];
  const finish=()=>{if(over)return;over=true;clearInterval(timer);
    const n=qs.length,win=g.eng?true:(id==="anat"?(i>=n&&score>=3):score>=Math.ceil(n*.7));
    if(id==="anat"&&win)ach("asp");
    if(g.eng&&tired>=n){ach("tired");S.e=clamp(S.e+1,0,10);mgShell(id,`<p>«Я устала» × ${n}</p>`);return setTimeout(()=>mgDone(id,true,g.tired,cb),900)}
    if(g.eng&&honest>=n)ach("poly");
    if(id==="omz"&&funny>=n){ach("doctor");stat("doctor");
      mgShell(id,`<p>Результат: <b>0 из ${n}</b>. Зато какие!</p>`);
      return setTimeout(()=>mgDone(id,true,"Преподаватель долго молчит. Потом медленно снимает очки.\n— Лысаченко. За одну пару вы не оказали первую помощь ни разу. Ни. Разу. Но каждый раз — с такой фантазией…\n\nОна кладёт очки на стол.\n— Это худшая практика в истории кафедры. И лучшая пара за семестр. Пять. За креативность. Но к аптечке вы больше не подходите. Никогда. Даже в магазине.\n\nГруппа аплодирует стоя. Манекен в углу, кажется, тоже.",cb),900)}
    mgShell(id,`<p>Результат: <b>${score} из ${n}</b>${id==="anat"&&i<n?" (время вышло)":""}</p>`);
    setTimeout(()=>mgDone(id,win,win?g.win:g.lose,cb),900);};
  if(left) timer=setInterval(()=>{left--;const t=$("qt");if(t)t.textContent=left+" с";if(left<=0)finish()},1000);
  const show=()=>{
    if(i>=qs.length) return finish();
    const x=qs[i];
    mgShell(id,`      <p class="note">Вопрос ${i+1} из ${qs.length}${left?` · ⏱ <span id="qt">${left} с</span>`:""}</p>
      <p style="font-weight:700">${esc(x.q)}</p>
      <div class="choices">${x.o.map((o,k)=>`<button class="choice opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>`);
    const btns=[...$("stage").querySelectorAll(".opt")];
    btns.forEach(b=>b.onclick=()=>{
      if(b.dataset.done)return;btns.forEach(z=>z.dataset.done=1);
      const k=+b.dataset.k;let ok=false,msg="";
      if(x.a===-1){ok=true;msg=x.note}
      else if(x.eng&&x.o[k]==="Я устала"){ok=true;tired++;stat("tired");msg=["Засчитано. Все устали.","Засчитано. Преподаватель тоже.","Засчитано… Подозрительно часто.","Преподаватель смотрит на тебя внимательно.","…"][Math.min(tired-1,4)]}
      else{ok=k===x.a;if(ok&&x.eng)honest++;if(!ok&&id==="omz"&&!MYTH.includes(x.o[k]))funny++;msg=ok?pick(["Верно!","Точно!","Именно так!"]):(id==="omz"&&!MYTH.includes(x.o[k])?pick(["Пострадавший смотрит на тебя с ужасом. Правильно: ","Преподаватель записывает это в тетрадь цитат. Правильно: ","Смело. Очень смело. Правильно: "]):"Правильно: ")+x.o[x.a];}
      if(ok)score++;
      if(id==="omz")joke(!ok&&!MYTH.includes(x.o[k]));if(x.eng)joke(x.o[k]==="Я устала");
      b.classList.add(ok?"ok":"bad");if(!ok&&x.a>=0)btns[x.a].classList.add("ok");
      $("fb").textContent=msg;$("fb").style.color=ok?"var(--ok)":"var(--bad)";
      if(left){setTimeout(()=>{i++;show()},x.a===-1?1800:1100)}
      else{$("fb").insertAdjacentHTML("afterend",`<button class="btn" id="nx">Дальше</button>`);$("nx").onclick=()=>{i++;show()}}
    });
  };
  show();
}
/* --- бинго скуки --- */
function mgBingo(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];
  const words=shuffle([...v.yes,...v.no]);const sel=new Set();
  mgShell(id,`<p class="note">Прочитай речь и отметь все слова, которые в ней прозвучали.</p>
    <div class="speech">${esc(v.speech)}</div>
    <div class="bgrid">${words.map((w,k)=>`<button class="bcell" data-k="${k}">${esc(w)}</button>`).join("")}</div>
    <button class="btn" id="bingo">Бинго!</button><div class="fb" id="fb"></div>`);
  $("stage").querySelectorAll(".bcell").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on")});
  $("bingo").onclick=()=>{
    let good=0,bad=0;
    $("stage").querySelectorAll(".bcell").forEach(b=>{const w=words[+b.dataset.k];const y=v.yes.includes(w);
      if(sel.has(+b.dataset.k)){y?good++:bad++;b.classList.add(y?"yes":"wrong")}else if(y)b.classList.add("yes");b.onclick=null});
    $("bingo").remove();
    const win=good>=5&&bad<=1;if(good===v.yes.length&&bad===0)ach("bingo");joke(bad>=2);
    $("fb").textContent=`Найдено ${good} из ${v.yes.length}${bad?`, лишних: ${bad}`:""}`;
    $("fb").insertAdjacentHTML("afterend",`<button class="btn" id="nx">Дальше</button>`);$("nx").onclick=()=>mgDone(id,win,win?g.win:g.lose,cb);
  };
}
/* --- найди ошибку --- */
function mgTap(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];let i=0,score=0;
  const show=()=>{
    if(i>=v.length){const win=score>=4;return mgDone(id,win,win?g.win:g.lose,cb)}
    const toks=v[i].split(" ");
    mgShell(id,`<p class="note">Предложение ${i+1} из ${v.length}. Нажми на слово с ошибкой.</p>
      <div class="words">${toks.map((t,k)=>`<button class="word" data-k="${k}">${esc(t.replace(/^\*/,""))}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
    const btns=[...$("stage").querySelectorAll(".word")];const wi=toks.findIndex(t=>t.startsWith("*"));
    btns.forEach(b=>b.onclick=()=>{if(b.dataset.done)return;btns.forEach(z=>z.dataset.done=1);
      const ok=+b.dataset.k===wi;if(ok)score++;b.classList.add(ok?"ok":"bad");if(!ok)btns[wi].classList.add("ok");
      $("fb").textContent=ok?"Поймала!":"Ошибка пряталась здесь";$("fb").style.color=ok?"var(--ok)":"var(--bad)";
      $("fb").insertAdjacentHTML("afterend",`<button class="btn" id="nx">Дальше</button>`);$("nx").onclick=()=>{i++;show()}});
  };
  show();
}
/* --- зелёная зона --- */
function mgTiming(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];mgTitle=v.name||null;
  let hits=0,tries=0,zl=.3,raf,t0=performance.now(),over=false;
  const MAXT=8;
  mgShell(id,`<p>${esc(v.intro)}</p>
    <div class="track" id="tr"><div class="zone" id="zn"></div><div class="marker" id="mk"></div></div>
    <p class="note" id="st">Попаданий: 0 из 3 · попыток осталось: ${MAXT}</p>
    <button class="btn" id="hit">${esc(v.btn||"Держать!")}</button><div class="fb" id="fb"></div>`);
  const zn=$("zn"),mk=$("mk");
  const place=()=>{zl=.08+R()*(.84-v.zone);zn.style.left=zl*100+"%";zn.style.width=v.zone*100+"%"};
  place();
  let pos=0;
  const loop=now=>{const t=(now-t0)/1000*v.speed;pos=Math.abs((t%2)-1);pos=1-pos;mk.style.left=pos*100+"%";raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  const end=win=>{over=true;cancelAnimationFrame(raf);if(win)ach("fiz");$("hit").disabled=true;setTimeout(()=>mgDone(id,win,win?v.win:v.lose,cb),900)};
  $("hit").onclick=()=>{
    if(over)return;tries++;
    const ok=pos>=zl-.03&&pos<=zl+v.zone+.03;if(ok){hits++;place()}
    $("fb").textContent=ok?"Есть!":"Мимо";$("fb").style.color=ok?"var(--ok)":"var(--bad)";
    $("st").textContent=`Попаданий: ${hits} из 3 · попыток осталось: ${MAXT-tries}`;
    if(hits>=3) end(true); else if(tries>=MAXT) end(false);
  };
}
/* --- не уснуть --- */
function mgAwake(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];
  mgShell(id,`<p>${esc(v.intro)}</p><button class="btn" id="go">Поехали</button>`);
  $("go").onclick=()=>{
    let sl=20,time=15,ti=0,over=false;
    mgShell(id,`<div class="slide" id="sld">${esc(v.titles[0])}</div>
      <p class="note">Сонливость:</p><div class="sleep"><i id="sb" style="width:20%"></i></div>
      <p class="note">Осталось: <span id="tm">15</span> с</p>
      <button class="btn" id="pinch">Ущипнуть себя</button>`);
    const iv=setInterval(()=>{sl+=v.rate/10;$("sb").style.width=Math.min(100,sl)+"%";if(sl>=100)end(false)},100);
    const it=setInterval(()=>{time--;$("tm").textContent=time;ti=(ti+1)%v.titles.length;$("sld").textContent=v.titles[ti];if(time<=0)end(true)},1000);
    const end=win=>{if(over)return;over=true;clearInterval(iv);clearInterval(it);if(!win)ach("slept");$("pinch").disabled=true;setTimeout(()=>mgDone(id,win,win?v.win:v.lose,cb),700)};
    $("pinch").onclick=()=>{if(over)return;sl=Math.max(0,sl-14);$("sb").style.width=sl+"%"};
  };
}
/* --- хронология --- */
function mgOrder(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];const sorted=v.slice().sort((a,b)=>a[1]-b[1]);
  let k=0,mist=0;const items=shuffle(v);
  mgShell(id,`<p class="note">Нажимай на события по порядку — от самого раннего.</p>
    <div class="olist" id="ol"></div>
    <div class="choices">${items.map((x,j)=>`<button class="choice ev" data-j="${j}">${esc(x[0])}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
  $("stage").querySelectorAll(".ev").forEach(b=>b.onclick=()=>{
    const x=items[+b.dataset.j];
    if(x[0]===sorted[k][0]){k++;b.remove();$("ol").insertAdjacentHTML("beforeend",`<div>${x[1]} — ${esc(x[0])}</div>`);
      if(k>=sorted.length){const win=mist<=1;$("fb").textContent=`Ошибок: ${mist}`;setTimeout(()=>mgDone(id,win,win?g.win:g.lose,cb),1200)}}
    else{mist++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("fb").textContent="Нет, сейчас другое событие. Ошибок: "+mist;$("fb").style.color="var(--bad)"}
  });
}
/* --- почини презентацию --- */
function mgFix(id,g,cb){
  const v=g.vars[varOf(id,g.vars.length)];const o=shuffle(v.o);
  const ch=o.map(x=>({t:x[0],fn:()=>{if(x[3])ach(x[3]);mgDone(id,!!x[1],x[2],cb)}}));
  if(S.calls>0) ch.push({t:"📞 Позвонить в Техподдержку Питера",s:`Звонков осталось: ${S.calls}`,fn:()=>{S.calls--;cnt("sup",2,"sup");supportText();mgDone(id,true,"— Техподдержка Питера, Андрей, слушаю.\nТы объясняешь проблему. Пауза.\n— Попробуйте выключить и включить.\nТы выключаешь и включаешь. Всё работает. Никто не понимает почему, включая Техподдержку.",cb)}});
  window.scrollTo({top:0});
  card({tag:"🎲 Мини-игра",title:MG_NAMES[id],text:g.intro+"\n\n"+v.q,choices:ch});
}
