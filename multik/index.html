<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Лягушонок едет в Армавир</title>
<meta name="theme-color" content="#1b1f3b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"Nunito",system-ui,sans-serif;color:#fff}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:#1b1f3b;--u:4px}
.layer{position:absolute;inset:0;pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:22%}
.a{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1;white-space:nowrap;will-change:transform,left,top}
.txt{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;width:88%;font:700 calc(var(--u)*9)/1.1 "Caveat",cursive;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#2a2238;border-radius:calc(var(--u)*4);padding:calc(var(--u)*2.2) calc(var(--u)*3.2);font:900 calc(var(--u)*4.2)/1.2 "Nunito",sans-serif;max-width:64%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;white-space:normal;z-index:20}
.bub:after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-2);border:calc(var(--u)*2.2) solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
#cap:empty{display:none}
#cap{position:absolute;left:5%;right:5%;background:rgba(20,14,40,.42);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*3);bottom:calc(5% + env(safe-area-inset-bottom));text-align:center;font:700 calc(var(--u)*6.6)/1.15 "Caveat",cursive;text-shadow:0 2px 8px rgba(0,0,0,.55);transition:opacity .5s;opacity:0;z-index:30}
#bar{position:absolute;top:0;left:0;height:3px;background:rgba(255,255,255,.8);width:0;z-index:40}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);z-index:50;background:radial-gradient(circle at 50% 40%,#3a2f6b,#13152b)}
#ui h1{margin:0 6%;text-align:center;font:700 calc(var(--u)*11)/1 "Caveat",cursive}
#ui p{margin:0 8%;text-align:center;opacity:.8;font-size:calc(var(--u)*4)}
.big{font-size:calc(var(--u)*24)}
.btn{border:none;border-radius:999px;background:#fff;color:#2a2238;font:900 calc(var(--u)*5)/1 "Nunito",sans-serif;padding:calc(var(--u)*4) calc(var(--u)*8);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#pause{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:45;border:none;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px;display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="scene"></div>
  <div id="cap"></div>
  <div id="bar"></div>
  <button id="pause">❚❚</button>
  <div id="ui"><div class="big">🐸</div><h1>Лягушонок едет в Армавир</h1><p>Мультфильм. Около минуты. Звук не нужен.</p><button class="btn" id="play">▶ Смотреть</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const stage=$("stage"),sc=$("scene"),cap=$("cap");
function fit(){stage.style.setProperty("--u",stage.clientWidth/100+"px")}
addEventListener("resize",fit);fit();

/* ================= движок ================= */
let timers=[],anims=[],paused=false;
function at(t,fn){const o={left:t,fn,start:performance.now()};o.id=setTimeout(()=>{o.done=1;fn()},t);timers.push(o)}
function clearAll(){timers.forEach(o=>clearTimeout(o.id));anims.forEach(a=>{try{a.cancel()}catch(e){}});timers=[];anims=[];sc.innerHTML="";cap.style.opacity=0}
function bg(css){sc.style.background=css}
function el(cls,html,st){const d=document.createElement("div");d.className=cls;d.innerHTML=html;Object.assign(d.style,st||{});sc.appendChild(d);return d}
/* актёр: эмодзи, позиция в процентах, размер в % ширины сцены */
function A(e,x,y,size,z){const d=el("a",e,{left:x+"%",top:y+"%",fontSize:`calc(var(--u)*${size})`,zIndex:z||5});d._x=x;d._y=y;return d}
function T(f){const s=f.s??1;return `translate(-50%,-50%) scale(${(f.f?-1:1)*s},${s}) rotate(${f.r||0}deg)`}
/* движение: ключевые кадры {x,y,s,r,o,f}, длительность, задержка */
function mv(d,frames,dur,delay=0,opt={}){
  const k=frames.map((f,i)=>({left:(f.x??d._x)+"%",top:(f.y??d._y)+"%",transform:T(f),opacity:f.o??1,offset:f.t??(frames.length>1?i/(frames.length-1):1)}));
  const a=d.animate(k,{duration:dur,delay,fill:"both",easing:opt.ease||"ease-in-out",iterations:opt.it||1,direction:opt.dir||"normal"});anims.push(a);return a}
function hop(d,x,y,dur,delay,n=3,f){const fr=[];for(let i=0;i<=n*2;i++){const k=i/(n*2);fr.push({x:d._x+(x-d._x)*k,y:(i%2?y-7:y)+(d._y-y)*(1-k)*0,f,t:k})}fr[fr.length-1].y=y;mv(d,fr,dur,delay,{ease:"linear"});d._x=x;d._y=y}
function bob(d,amp=1.5,dur=900,f){mv(d,[{y:d._y,f},{y:d._y-amp,f},{y:d._y,f}],dur,0,{it:Infinity})}
function pop(d,delay=0,f){mv(d,[{s:0,o:0,f},{s:1.25,f},{s:1,f}],500,delay,{ease:"cubic-bezier(.2,1.6,.4,1)"})}
function say(x,y,text,t,dur=2400){at(t,()=>{const b=el("bub",text,{left:x+"%",top:y+"%"});
  const W=stage.clientWidth,bw=b.offsetWidth,cx=x/100*W,m=W*.03;if(cx-bw/2<m)b.style.left=(m+bw/2)/W*100+"%";else if(cx+bw/2>W-m)b.style.left=(W-m-bw/2)/W*100+"%";const a=b.animate([{opacity:0,transform:"translate(-50%,-90%) scale(.6)"},{opacity:1,transform:"translate(-50%,-100%) scale(1)",offset:.12},{opacity:1,transform:"translate(-50%,-100%) scale(1)",offset:.88},{opacity:0,transform:"translate(-50%,-100%) scale(.9)"}],{duration:dur,fill:"both"});anims.push(a)})}
function caption(text,t){at(t,()=>{cap.style.opacity=0;setTimeout(()=>{cap.textContent=text;cap.style.opacity=1},text?250:0)})}
function rain(e,n,dur,size=4,from=-10,spread=100){for(let i=0;i<n;i++){const d=A(e,Math.random()*spread+(100-spread)/2,from,size,3);mv(d,[{y:from,o:.9},{y:110,o:.9}],dur*(.7+Math.random()*.6),Math.random()*dur,{ease:"linear",it:Infinity})}}
function burst(x,y,e,n,delay=0,size=6){for(let i=0;i<n;i++){const d=A(e,x,y,size,15);const a=Math.random()*6.28,r=18+Math.random()*22;mv(d,[{s:0,o:0},{s:1,o:1,t:.2},{x:x+Math.cos(a)*r,y:y+Math.sin(a)*r*.8,s:.6,o:0}],1600+Math.random()*600,delay+Math.random()*200,{ease:"ease-out"})}}
function title(html,y,t,dur,size){at(t,()=>{const d=el("txt",html,{top:y+"%",fontSize:size?`calc(var(--u)*${size})`:""});
  const a=dur>9e8?d.animate([{opacity:0,transform:"translate(-50%,-40%)"},{opacity:1,transform:"translate(-50%,-50%)"}],{duration:700,fill:"both",easing:"ease-out"})
    :d.animate([{opacity:0,transform:"translate(-50%,-40%)"},{opacity:1,transform:"translate(-50%,-50%)",offset:.15},{opacity:1,transform:"translate(-50%,-50%)",offset:.85},{opacity:0,transform:"translate(-50%,-50%)"}],{duration:dur,fill:"both"});anims.push(a)})}
function ground(css){el("ground","",{background:css})}

/* ================= сцены ================= */
const SCENES=[
 /* 1. Заставка */
 ()=>{bg("radial-gradient(circle at 50% 35%,#3a2f6b,#13152b)");
   for(let i=0;i<18;i++){const s=A("✨",Math.random()*100,Math.random()*70,2+Math.random()*3,1);mv(s,[{o:.2},{o:1},{o:.2}],1500+Math.random()*1500,Math.random()*1000,{it:Infinity})}
   title("Студия «Клоун из Сибири»<br>представляет",30,300,2600,7);
   title("Лягушонок<br>едет в Армавир",34,3000,3200,12);
   const f=A("🐸",50,72,22);pop(f,3200);at(3800,()=>bob(f,2,700));
   return 6400},
 /* 2. Питер, дождь */
 ()=>{bg("linear-gradient(#2c3e5c,#5b6b85)");ground("linear-gradient(#3d4a5e,#2b3444)");
   A("🏛",16,70,26,2);A("🏢",84,66,30,2);A("🏢",62,72,18,2);
   rain("💧",26,1400,3);
   const f=A("🐸",42,80,18,6),ph=A("📱",56,80,8,6);bob(ph,1,1200);
   caption("Санкт-Петербург. Дождь. Как обычно.",200);
   say(42,70,"Опять 2000 км между нами…",1200,2800);
   at(4300,()=>{const l=A("💡",42,62,10,7);pop(l)});
   say(42,70,"А что если… поехать?!",4800,2400);
   at(6400,()=>mv(f,[{y:80},{y:68,s:1.1},{y:80},{y:70},{y:80}],1200));
   return 8000},
 /* 3. Сборы */
 ()=>{bg("linear-gradient(#f6d9a8,#eab676)");ground("linear-gradient(#b5794a,#8a5634)");
   A("🪟",80,30,22,1);A("🛏",16,70,26,2);
   const bp=A("🎒",56,76,22,6),f=A("🐸",26,80,15,7);bob(f,1.2,600);
   caption("Собираем самое важное",200);
   ["💐","🍫","🧦","🎁","🧸"].forEach((e,i)=>{const d=A(e,10+i*20,8,9,8);mv(d,[{x:10+i*20,y:8,s:1,r:0},{x:35+i*5,y:30,s:1.1,r:180,t:.5},{x:56,y:72,s:.25,r:360,o:0}],1100,600+i*650,{ease:"ease-in"})});
   at(4200,()=>mv(bp,[{s:1},{s:1.15},{s:1}],400,0));
   at(4600,()=>{const h=A("❤️",56,40,12,9);mv(h,[{x:56,y:40,s:1},{x:56,y:68,s:1},{x:60,y:54,s:1.1,t:.65},{x:26,y:70,s:.4,o:0}],2200)});
   caption("Любовь в рюкзак не влезла. Пришлось везти в сердце.",5000);
   return 8200},
 /* 4. Поезд */
 ()=>{bg("linear-gradient(#8fd0ff,#dff3ff)");ground("linear-gradient(#7cc56b,#4f9a46)");
   const night=el("layer","",{background:"linear-gradient(#0f1535,#2b3561)",opacity:0,zIndex:0});
   const sun=A("☀️",80,16,14,1),moon=A("🌙",20,16,12,1);moon.style.opacity=0;
   at(4200,()=>{const a=night.animate([{opacity:0},{opacity:1}],{duration:1500,fill:"forwards"});anims.push(a);mv(sun,[{o:1},{y:40,o:0}],1500);mv(moon,[{o:0,y:30},{o:1,y:16}],1500,400)});
   const row=["🌲","🏠","🌻","🐄","🌳","⛪","🌲","🌾","🏡","🌲","🐑","🌳"];
   for(let k=0;k<2;k++)row.forEach((e,i)=>{const d=A(e,110+i*18+k*216,72-(i%2)*3,9,2);mv(d,[{x:110+i*18+k*216},{x:-110+i*18+k*216-216}],9000,0,{ease:"linear"})});
   const tr=A("🚃🚃🚂",50,64,15,6);mv(tr,[{f:true},{y:63.3,f:true},{f:true}],320,0,{it:Infinity});
   const f=A("🐸",61,55,6,7);mv(f,[{},{y:54.4},{}],320,0,{it:Infinity});
   caption("Сутки в пути. Колёса стучат: «к Ю-ле, к Ю-ле…»",300);
   caption("За окном поля, коровы и мысли только об одном",4600);
   return 9000},
 /* 5. Дракон-Дедлайн */
 ()=>{bg("linear-gradient(#6b2a3a,#c7593e)");ground("linear-gradient(#5a2a2a,#3a1a1a)");
   const f=A("🐸",22,80,16,6);
   const dr=A("🐉",120,58,40,5);mv(dr,[{x:120,f:true},{x:66,f:true}],1400,200,{ease:"ease-out"});dr._x=66;
   at(1600,()=>{const c=el("txt","⏰ 23:59",{top:"34%",left:"66%",fontSize:"calc(var(--u)*8)",color:"#ffd2c2"});const a=c.animate([{opacity:.3},{opacity:1}],{duration:500,iterations:Infinity,direction:"alternate"});anims.push(a);c.classList.add("clock")});
   caption("Но дорогу преградил Великий Дедлайн",200);
   say(64,42,"Не пущу! Сначала сдай все лабы!",1900,2800);
   at(4600,()=>{const lp=A("💻",34,80,10,7);pop(lp)});
   caption("Лягушонок открыл ноутбук…",4500);
   for(let i=0;i<6;i++){at(5300+i*380,()=>{const s=A("✅",36,74,7,8);mv(s,[{x:36,y:74},{x:62,y:54,r:360}],380,0,{ease:"ease-in"});mv(dr,[{x:66,f:true,r:0},{x:68,f:true,r:-8},{x:66,f:true,r:0}],300,330)})}
   at(7700,()=>{burst(64,56,"💥",8,0,9);mv(dr,[{f:true,s:1},{f:true,s:.25,o:0}],600);const cl=sc.querySelector(".clock");if(cl)cl.remove();
     const li=A("🦎",64,62,9,6);mv(li,[{x:64,s:0,f:true},{x:64,s:1,f:true,t:.3},{x:115,s:1,f:true}],1600,500)});
   caption("Лабы сданы с первого раза. Дедлайн повержен!",7800);
   return 10400},
 /* 6. Армавир, тучи */
 ()=>{bg("linear-gradient(#7a8597,#a9b2bf)");ground("linear-gradient(#8a9a6a,#5d6e45)");
   const sky=el("layer","",{background:"linear-gradient(#7fd1ff,#d8f1ff)",opacity:0,zIndex:0});
   A("🏘",50,74,26,2);
   const cl=[A("☁️",20,14,24,4),A("☁️",55,10,28,4),A("☁️",85,18,22,4)];
   rain("💧",18,1300,3,4,90);
   const f=A("🐸",30,82,13,6),um=A("☂️",30,70,14,7);bob(um,1,900);
   caption("Армавир встретил тучами…",200);
   at(3300,()=>{cl.forEach((c,i)=>mv(c,[{x:c._x},{x:i<1?-40:140}],1800));const a=sky.animate([{opacity:0},{opacity:1}],{duration:1600,fill:"forwards"});anims.push(a);sc.querySelectorAll(".a").forEach(d=>{if(d.textContent==="💧")d.style.display="none"});
     const rb=A("🌈",50,24,50,1);pop(rb,600);const sn=A("☀️",82,12,12,1);pop(sn,900);mv(um,[{y:70,o:1},{y:60,o:0}],600,300)});
   caption("…но ненадолго. Ведь здесь живёт самое настоящее солнце",3600);
   return 8200},
 /* 7. Под окном */
 ()=>{bg("linear-gradient(#3b2a6b,#8a5fb8)");ground("linear-gradient(#41306a,#2b2048)");
   for(let i=0;i<10;i++){const s=A("✨",Math.random()*100,Math.random()*30,2.5,1);mv(s,[{o:.2},{o:1},{o:.2}],1400,Math.random()*900,{it:Infinity})}
   A("🏢",70,46,62,2);
   const f=A("🐸",24,80,14,6),g=A("🎸",36,82,10,7);mv(g,[{r:-10},{r:10},{r:-10}],600,0,{it:Infinity});
   for(let i=0;i<8;i++){const n=A(i%2?"🎵":"🎶",38,74,6,8);mv(n,[{x:38,y:74,o:0,s:.5},{x:44+i%3*6,y:60,o:1,s:1,t:.3},{x:52+i%4*5,y:40,o:0,s:1.2}],2200,600+i*900,{it:Infinity})}
   const p=A("👸",76,40,10,4);p.style.opacity=0;
   caption("Общежитие. Третий этаж. Окно со светом",200);
   say(24,70,"Ю-у-уля-а-а! 🎶",1800,2200);
   at(3600,()=>pop(p));
   say(70,33,"Лягушонок?! Ты откуда?!",4300,2400);
   say(24,70,"Из Питера! Пешком было бы дольше",6900,2600);
   return 10000},
 /* 8. Встреча */
 ()=>{bg("linear-gradient(#ff9a8b,#ff6a88 55%,#ff99ac)");ground("linear-gradient(#b85c7a,#8a3f5c)");
   const p=A("👸",85,76,17,6),f=A("🐸",15,80,14,6);
   mv(p,[{x:85},{x:58}],2400,300);p._x=58;
   hop(f,42,80,2400,300,4);
   at(3200,()=>{const fl=A("💐",42,74,9,8);mv(fl,[{x:42,y:74,s:.4},{x:52,y:66,s:1.2},{x:56,y:72,s:1}],900)});
   at(5200,()=>{const k=A("💋",50,62,12,9);pop(k);burst(50,62,"❤️",14,200,6)});
   caption("Принцесса поцеловала лягушонка, и…",5000);
   caption("…он остался лягушонком. Потому что ей он нравится именно таким",7400);
   at(7600,()=>mv(f,[{r:0},{r:360,y:72},{r:720,y:80}],900));
   return 10600},
 /* 9. Вечер вдвоём */
 ()=>{bg("linear-gradient(#0b1033,#263070)");ground("linear-gradient(#1b2250,#121738)");
   for(let i=0;i<22;i++){const s=A("·",Math.random()*100,Math.random()*60,6,1);mv(s,[{o:.2},{o:1},{o:.2}],1200+Math.random()*1500,Math.random()*1000,{it:Infinity})}
   A("🌙",80,14,14,1);
   const f=A("🐸",42,76,12,6),p=A("👸",58,75,14,6);A("☕",46,84,5,7);A("☕",54,84,5,7);A("🍣",50,85,5,7);
   at(2300,()=>{const st=A("☄️",110,8,9,2);mv(st,[{x:110,y:8},{x:-10,y:34}],1400)});
   say(42,66,"Загадала желание?",3200,2300);
   say(58,64,"Оно уже сбылось",5600,2400);
   caption("А дальше — сессия, лето и Питер. Но это уже другая серия",7600);
   return 10400},
 /* 10. Финал */
 ()=>{bg("radial-gradient(circle at 50% 40%,#ff7a8a,#7a3fb8)");
   rain("❤️",16,3200,5);
   title("Конец",24,200,1e9,16);
   title("Точнее — только начало",36,1400,1e9,8);
   title("Юля, я тебя люблю ❤️",52,2800,1e9,9);
   title("— твой Лягушонок 🐸",61,3800,1e9,7);
   at(5000,()=>{const b=document.createElement("button");b.className="btn";b.textContent="↺ Ещё раз";Object.assign(b.style,{position:"absolute",left:"50%",top:"78%",transform:"translate(-50%,-50%)",zIndex:60});b.onclick=e=>{e.stopPropagation();run(0)};sc.appendChild(b)});
   return null}
];
const DUR=SCENES.length;
let cur=0,sceneStart=0,sceneLen=0;
function run(i){
  clearAll();cur=i;paused=false;$("pause").textContent="❚❚";
  const len=SCENES[i]();sceneStart=performance.now();sceneLen=len||0;
  $("bar").style.width=(i/(DUR-1)*100)+"%";
  if(len)at(len,()=>run(i+1));
}
/* пауза: останавливаем анимации и таймеры */
function togglePause(){
  if(!paused){paused=true;anims.forEach(a=>{try{a.pause()}catch(e){}});timers.forEach(o=>{if(!o.done){clearTimeout(o.id);o.left-=performance.now()-o.start}});$("pause").textContent="▶"}
  else{paused=false;anims.forEach(a=>{try{a.play()}catch(e){}});timers.forEach(o=>{if(!o.done){o.start=performance.now();o.id=setTimeout(()=>{o.done=1;o.fn()},Math.max(0,o.left))}});$("pause").textContent="❚❚"}
}
$("pause").onclick=e=>{e.stopPropagation();togglePause()};
$("play").onclick=()=>{$("ui").style.display="none";$("pause").style.display="block";run(0)};
</script>
</body>
</html>
